<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NautilusOS - Emerald Edition</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #041d14 0%, #020617 100%);
      --accent: #10b981;
      --accent-hover: #059669;
      --window-bg: rgba(11, 20, 32, 0.95);
      --text: #f8fafc;
      --border: rgba(16, 185, 129, 0.4);
    }

    body.custom-cursor, body.custom-cursor * {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%2310b981"><polygon points="0,0 0,18 5,13 9,21 12,20 8,12 15,12"/></svg>'), auto !important;
    }

    body.theme-cyber {
      --bg-gradient: radial-gradient(circle at center, #2e1065 0%, #090514 100%);
      --accent: #06b6d4;
      --border: rgba(6, 182, 212, 0.4);
    }
    body.theme-midnight {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      --accent: #6366f1;
      --border: rgba(99, 102, 241, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-gradient); height: 100vh; overflow: hidden; color: var(--text); position: relative; }

    #fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    /* Desktop Layout */
    #desktop {
      width: 100vw; height: calc(100vh - 80px); position: relative; padding: 24px; z-index: 2; display: flex; flex-direction: column; flex-wrap: wrap; gap: 16px; align-content: flex-start;
    }
    .desktop-icon {
      width: 96px; height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 8px; border-radius: 12px; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.3); backdrop-filter: blur(8px);
    }
    .desktop-icon:hover { background: rgba(16, 185, 129, 0.15); border-color: var(--accent); transform: translateY(-2px); }
    .icon-svg { width: 36px; height: 36px; fill: var(--accent); }
    .icon-label { font-size: 11px; text-align: center; font-weight: 500; text-shadow: 0 1px 3px #000; }

    /* Draggable Floating JS Bar */
    #js-menu-bar {
      position: fixed; top: 20px; right: 20px; background: #0b1420; border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; z-index: 9000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); cursor: move; backdrop-filter: blur(12px);
    }
    .js-menu-title { font-size: 12px; font-weight: bold; color: var(--accent); margin-right: 4px; }
    .js-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; padding: 5px 11px; border-radius: 10px; font-size: 11px; cursor: pointer; transition: 0.2s; }
    .js-btn:hover { background: var(--accent); color: #000; font-weight: bold; }
    .js-btn-stop { background: #ef4444 !important; color: #fff !important; border: none; }

    /* Taskbar Dock */
    #dock-container { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10000; }
    #capsule-dock { height: 58px; background: #070d18; border: 1px solid var(--border); border-radius: 30px; backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 20px; gap: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .dock-btn { background: transparent; border: none; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 50%; transition: 0.2s; }
    .dock-btn:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.1); }
    .dock-svg { width: 22px; height: 22px; fill: var(--accent); }
    .dock-divider { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.15); }
    .dock-clock { font-size: 13px; font-weight: 600; }

    /* Windows */
    .window { position: absolute; width: 800px; height: 540px; max-width: 95vw; max-height: 85vh; background: var(--window-bg); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); backdrop-filter: blur(16px); display: flex; flex-direction: column; overflow: hidden; z-index: 10; }
    .window-header { height: 40px; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; cursor: move; border-bottom: 1px solid var(--border); }
    .window-title { font-size: 13px; font-weight: 600; }
    .window-controls { display: flex; gap: 8px; }
    .control-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
    .btn-close { background: #ef4444; } .btn-min { background: #f59e0b; } .btn-max { background: var(--accent); }

    .window-content { flex: 1; display: flex; flex-direction: column; overflow: auto; background: #040810; position: relative; }
    .app-container { padding: 20px; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    .browser-btn { background: #1e293b; border: 1px solid var(--border); color: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.2s; }
    .browser-btn:hover { background: var(--accent); color: #000; font-weight: bold; }
    .browser-input { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none; }

    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .app-card { background: #0f172a; border: 1px solid var(--border); padding: 14px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }

    #toast-container { position: fixed; top: 20px; left: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: var(--accent); color: #000; padding: 12px 20px; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body class="custom-cursor">

  <canvas id="fx-canvas"></canvas>

  <!-- JS Quick Control Menu -->
  <div id="js-menu-bar" onmousedown="dragJSMenu(event)">
    <span class="js-menu-title">⚡ JS Quick Menu</span>
    <button class="js-btn" onclick="openApp('emeraldworld')">3D Emerald World</button>
    <button class="js-btn" onclick="openApp('lofi')">LoFi Station</button>
    <button class="js-btn" onclick="triggerMatrixEffect()">Matrix FX</button>
    <button class="js-btn" onclick="toggleCustomCursor()">Toggle Cursor</button>
    <button class="js-btn js-btn-stop" onclick="stopAllAnimations()">⏹ STOP FX</button>
  </div>

  <div id="desktop"></div>

  <!-- Taskbar Dock -->
  <div id="dock-container">
    <div id="capsule-dock">
      <button class="dock-btn" onclick="openApp('emeraldworld')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9L2 6v11l10 5 10-5V6l-10 5z"/></svg></button>
      <button class="dock-btn" onclick="openApp('lofi')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></button>
      <button class="dock-btn" onclick="openApp('eta')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></button>
      <button class="dock-btn" onclick="openApp('photos')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2z"/></svg></button>
      <button class="dock-btn" onclick="openApp('tasks')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></button>
      <div class="dock-divider"></div>
      <div class="dock-clock" id="dock-clock">12:00 PM</div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    const appsCatalog = [
      { id: 'emeraldworld', name: 'Emerald World 3D', icon: '<path d="M12 2L2 7l10 5 10-5-10-5zm0 9L2 6v11l10 5 10-5V6l-10 5z"/>' },
      { id: 'lofi', name: 'LoFi Radio Station', icon: '<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>' },
      { id: 'eta', name: 'ETA Collection', icon: '<path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>' },
      { id: 'photos', name: 'Photos & Wallpaper', icon: '<path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2z"/>' },
      { id: 'tasks', name: 'Task Board', icon: '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>' },
      { id: 'paint', name: 'Paint Lab', icon: '<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61.43.54 1.03.89 1.7.89h1.83c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.37-.61-.37-1 0-.83.67-1.5 1.5-1.5H15c2.76 0 5-2.24 5-5 0-4.42-3.58-8-8-8z"/>' },
      { id: 'terminal', name: 'Terminal Shell', icon: '<path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.11-.9-2-2-2z"/>' },
      { id: 'settings', name: 'System Settings', icon: '<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58z"/>' }
    ];

    let activeZIndex = 100;
    let openWindows = {};
    let matrixInterval = null;

    function showToast(msg) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast'; t.innerText = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    function updateClock() {
      document.getElementById('dock-clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000); updateClock();

    function toggleCustomCursor() {
      document.body.classList.toggle('custom-cursor');
      showToast('Cursor Toggled!');
    }

    function stopAllAnimations() {
      if (matrixInterval) { clearInterval(matrixInterval); matrixInterval = null; }
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      showToast('All FX Animations Stopped');
    }

    function renderDesktop() {
      const desktop = document.getElementById('desktop');
      desktop.innerHTML = '';
      appsCatalog.forEach(app => {
        const icon = document.createElement('div');
        icon.className = 'desktop-icon';
        icon.ondblclick = () => openApp(app.id);
        icon.innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24">${app.icon}</svg><span class="icon-label">${app.name}</span>`;
        desktop.appendChild(icon);
      });
    }

    function dragJSMenu(e) {
      const bar = document.getElementById('js-menu-bar');
      let shiftX = e.clientX - bar.getBoundingClientRect().left;
      let shiftY = e.clientY - bar.getBoundingClientRect().top;
      document.onmousemove = (e) => {
        bar.style.left = (e.clientX - shiftX) + 'px';
        bar.style.top = (e.clientY - shiftY) + 'px';
        bar.style.right = 'auto';
      };
      document.onmouseup = () => document.onmousemove = null;
    }

    function openApp(appId) {
      if (openWindows[appId]) {
        const existing = document.getElementById(openWindows[appId]);
        if (existing) { existing.style.display = 'flex'; existing.style.zIndex = ++activeZIndex; return; }
      }

      const winId = 'win-' + Date.now();
      openWindows[appId] = winId;
      const appObj = appsCatalog.find(a => a.id === appId) || { name: 'App' };
      let content = '';

      if (appId === 'emeraldworld') {
        content = `
          <div style="width:100%; height:100%; position:relative; overflow:hidden;">
            <canvas id="ew-canvas-${winId}" style="width:100%; height:100%; display:block;"></canvas>
            <div style="position:absolute; top:15px; left:15px; background:rgba(2, 6, 23, 0.85); padding:14px; border-radius:10px; border:1px solid var(--border); width:280px;">
              <h3 style="color:var(--accent);">Emerald World 3D Flight</h3>
              <p style="font-size:11px; color:#cbd5e1; margin-top:4px;">Scroll <b>DOWN</b> to move forward, <b>UP</b> to move back.</p>
              
              <div style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
                <div style="display:flex; gap:6px; align-items:center;">
                  <button class="browser-btn" onclick="adjust3DDistance('${winId}', -150)">▲ Up (Back)</button>
                  <button class="browser-btn" onclick="adjust3DDistance('${winId}', 150)">▼ Down (Forward)</button>
                </div>
                <div style="display:flex; gap:6px; align-items:center;">
                  <input type="number" id="ew-pos-input-${winId}" class="browser-input" style="width:100px;" value="0">
                  <button class="browser-btn" onclick="set3DDistance('${winId}')">Set Distance</button>
                </div>
                <div id="ew-checkpoint-label-${winId}" style="font-size:12px; font-weight:bold; color:var(--accent); margin-top:4px;">Node: Starting Point</div>
              </div>
            </div>
          </div>`;

      } else if (appId === 'lofi') {
        content = `
          <div class="app-container" style="align-items:center; justify-content:center; text-align:center;">
            <h2>📻 LoFi Chill Beats Radio</h2>
            <div style="width:120px; height:120px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; box-shadow:0 0 30px var(--accent);">
              <svg style="width:60px; height:60px; fill:#000;" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            <p id="lofi-status">Station Online - Playing Stream #1</p>
            <div style="display:flex; gap:10px;">
              <button class="browser-btn" onclick="showToast('Playing LoFi Stream 1')">▶ Play Stream 1</button>
              <button class="browser-btn" onclick="showToast('Playing Ambient Chill')">▶ Play Ambient</button>
            </div>
          </div>`;

      } else if (appId === 'eta') {
        content = `
          <div class="app-container">
            <h2>✈️ ETA Collection Live Tracker</h2>
            <div class="app-grid">
              <div class="app-card">
                <h4>Flight Tracker</h4>
                <p style="font-size:12px; color:#94a3b8;">Flight NZ-302 -> Arriving in 14 mins</p>
                <button class="browser-btn" onclick="showToast('Updated Flight NZ-302 status')">Refresh ETA</button>
              </div>
              <div class="app-card">
                <h4>Metro Express</h4>
                <p style="font-size:12px; color:#94a3b8;">Line 4 Transit -> Arriving in 3 mins</p>
                <button class="browser-btn" onclick="showToast('Metro Line 4 On-Time')">Refresh Transit</button>
              </div>
              <div class="app-card">
                <h4>Parcel Delivery</h4>
                <p style="font-size:12px; color:#94a3b8;">Courier Drone -> ETA 18:30 PM</p>
                <button class="browser-btn" onclick="showToast('Parcel in transit')">Track Package</button>
              </div>
            </div>
          </div>`;

      } else if (appId === 'photos') {
        content = `
          <div class="app-container">
            <h2>🖼️ Photos & Wallpaper</h2>
            <button class="browser-btn" onclick="uploadPhotos('${winId}')">📂 Choose Local Photo File</button>
            <div class="app-grid" id="photo-grid-${winId}"></div>
          </div>`;

      } else if (appId === 'tasks') {
        content = `
          <div class="app-container">
            <h2>⚡ Task Board</h2>
            <div style="display:flex; gap:8px;">
              <input type="text" id="task-in-${winId}" class="browser-input" placeholder="New task name..." style="flex:1;">
              <button class="browser-btn" onclick="addTask('${winId}')">Add Task</button>
            </div>
            <div id="task-list-${winId}" style="display:flex; flex-direction:column; gap:8px;"></div>
          </div>`;

      } else if (appId === 'paint') {
        content = `
          <div class="app-container" style="align-items:center;">
            <div style="display:flex; gap:10px; width:100%; align-items:center;">
              <input type="color" id="paint-col-${winId}" value="#10b981">
              <button class="browser-btn" onclick="clearCanvas('${winId}')">Clear Canvas</button>
            </div>
            <canvas id="paint-canv-${winId}" width="720" height="360" style="background:#fff; border-radius:8px; cursor:crosshair;"></canvas>
          </div>`;

      } else if (appId === 'terminal') {
        content = `
          <div style="background:#020617; color:var(--accent); font-family:monospace; padding:12px; height:100%; display:flex; flex-direction:column;">
            <div id="term-out-${winId}" style="flex:1; overflow-y:auto;">Emerald Terminal Engine v10.0<br>Type 'help' for command list.</div>
            <div style="display:flex; gap:6px; margin-top:8px;">
              <span>$</span>
              <input type="text" id="term-in-${winId}" style="background:transparent; border:none; outline:none; color:inherit; width:100%; font-family:monospace;" onkeydown="if(event.key==='Enter') runTermCmd('${winId}')">
            </div>
          </div>`;

      } else if (appId === 'settings') {
        content = `
          <div class="app-container">
            <h2>⚙️ Expanded System Settings</h2>
            <div class="app-card" style="align-items:flex-start;">
              <h4>Visual Themes</h4>
              <div style="display:flex; gap:8px; margin-top:6px;">
                <button class="browser-btn" onclick="document.body.className='custom-cursor'">Emerald Theme</button>
                <button class="browser-btn" onclick="document.body.className='theme-cyber custom-cursor'">Cyberpunk Theme</button>
                <button class="browser-btn" onclick="document.body.className='theme-midnight custom-cursor'">Midnight Theme</button>
              </div>
            </div>
            <div class="app-card" style="align-items:flex-start;">
              <h4>Cursor & Render Engine</h4>
              <div style="display:flex; gap:8px; margin-top:6px;">
                <button class="browser-btn" onclick="toggleCustomCursor()">Toggle Custom Cursor</button>
                <button class="browser-btn" onclick="stopAllAnimations()">Stop FX Rendering</button>
              </div>
            </div>
          </div>`;
      }

      const win = document.createElement('div');
      win.className = 'window';
      win.id = winId;
      win.style.top = `${50 + (Object.keys(openWindows).length * 15)}px`;
      win.style.left = `${60 + (Object.keys(openWindows).length * 15)}px`;
      win.style.zIndex = ++activeZIndex;

      win.innerHTML = `
        <div class="window-header" onmousedown="dragWindow(event, '${winId}')">
          <div class="window-title">⚡ ${appObj.name}</div>
          <div class="window-controls">
            <button class="control-btn btn-min" onclick="document.getElementById('${winId}').style.display='none'"></button>
            <button class="control-btn btn-max" onclick="maximizeWin('${winId}')"></button>
            <button class="control-btn btn-close" onclick="closeWin('${appId}', '${winId}')"></button>
          </div>
        </div>
        <div class="window-content">${content}</div>`;

      win.onmousedown = () => { win.style.zIndex = ++activeZIndex; };
      document.body.appendChild(win);

      if (appId === 'emeraldworld') init3DFlightEngine(winId);
      if (appId === 'paint') initPaintCanvas(winId);
      if (appId === 'tasks') renderTaskList(winId);
    }

    function closeWin(appId, winId) { document.getElementById(winId)?.remove(); delete openWindows[appId]; }
    function maximizeWin(id) { const win = document.getElementById(id); win.style.width = win.style.width === '100vw' ? '800px' : '100vw'; win.style.height = win.style.height === 'calc(100vh - 80px)' ? '540px' : 'calc(100vh - 80px)'; }
    function dragWindow(e, id) { const win = document.getElementById(id); let shiftX = e.clientX - win.getBoundingClientRect().left; let shiftY = e.clientY - win.getBoundingClientRect().top; document.onmousemove = (e) => { win.style.left = (e.clientX - shiftX) + 'px'; win.style.top = (e.clientY - shiftY) + 'px'; }; document.onmouseup = () => document.onmousemove = null; }

    /* Custom 3D Flight & Waypoint Path Engine */
    let flightDistances = {};
    function init3DFlightEngine(winId) {
      setTimeout(() => {
        const canvas = document.getElementById(`ew-canvas-${winId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        flightDistances[winId] = 0;
        let lapCount = 1;

        // Path Node Definitions
        const defaultWaypoints = [
          { z: 0, app: null, label: 'Start Hub' },
          { z: 600, app: 'lofi', label: 'LoFi Radio Station' },
          { z: 1200, app: 'paint', label: 'Paint Lab Studio' },
          { z: 1800, app: 'tasks', label: 'Task Board HQ' },
          { z: 2400, app: 'terminal', label: 'Terminal Gateway' }
        ];

        let activeWaypoints = JSON.parse(JSON.stringify(defaultWaypoints));

        // Scroll Down = Move Forward, Scroll Up = Move Backward
        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          flightDistances[winId] += e.deltaY * 0.8;
          if (flightDistances[winId] < 0) flightDistances[winId] = 0;
          updateUI();
        });

        function generateRandomPath() {
          showToast('Generating Random 3D Waypoint Path for Lap 2!');
          activeWaypoints = [
            { z: 0, app: null, label: 'Start Hub (Randomized)' },
            { z: 500 + Math.random() * 200, app: 'terminal', label: 'Random Terminal Node' },
            { z: 1100 + Math.random() * 200, app: 'lofi', label: 'Random LoFi Station' },
            { z: 1700 + Math.random() * 200, app: 'photos', label: 'Random Photo Hub' },
            { z: 2400, app: 'eta', label: 'Random ETA Gateway' }
          ];
        }

        function updateUI() {
          const inp = document.getElementById(`ew-pos-input-${winId}`);
          if (inp) inp.value = Math.round(flightDistances[winId]);

          // Loop mechanism
          if (flightDistances[winId] > 2600) {
            flightDistances[winId] = 0;
            lapCount++;
            if (lapCount % 2 === 0) generateRandomPath();
            else activeWaypoints = JSON.parse(JSON.stringify(defaultWaypoints));
          }

          // Check current nearest waypoint
          let currentDist = flightDistances[winId];
          let closest = activeWaypoints.reduce((prev, curr) => Math.abs(curr.z - currentDist) < Math.abs(prev.z - currentDist) ? curr : prev);
          const label = document.getElementById(`ew-checkpoint-label-${winId}`);
          if (label) label.innerText = `Node: ${closest.label} (Lap ${lapCount})`;

          // Trigger app auto launch when directly hitting waypoint
          if (Math.abs(closest.z - currentDist) < 15 && closest.app) {
            openApp(closest.app);
          }
        }

        function render() {
          if (!document.getElementById(`ew-canvas-${winId}`)) return;
          ctx.fillStyle = '#020617';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          let curZ = flightDistances[winId];

          // Draw 3D Tunnel Grid
          for (let i = 0; i < 160; i++) {
            let z = (i * 30 - (curZ % 30));
            if (z <= 0) continue;
            let k = 280 / z;
            let radius = 600 * k;

            ctx.strokeStyle = `rgba(16, 185, 129, ${Math.max(0, 1 - z / 1200)})`;
            ctx.beginPath();
            ctx.arc(cx + Math.sin(z * 0.005) * 100, cy + Math.cos(z * 0.005) * 50, radius, 0, Math.PI * 2);
            ctx.stroke();
          }

          // Draw Waypoint Nodes
          activeWaypoints.forEach(wp => {
            let relZ = wp.z - curZ;
            if (relZ > 0 && relZ < 1500) {
              let k = 280 / relZ;
              let x = cx + Math.sin(wp.z * 0.005) * 100;
              let y = cy + Math.cos(wp.z * 0.005) * 50;

              ctx.fillStyle = '#10b981';
              ctx.beginPath();
              ctx.arc(x, y, 18 * k, 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = '#ffffff';
              ctx.font = `${Math.max(10, 16 * k)}px Segoe UI`;
              ctx.fillText(wp.label, x + 25 * k, y + 5 * k);
            }
          });

          requestAnimationFrame(render);
        }
        render();
      }, 100);
    }

    function adjust3DDistance(winId, amt) {
      flightDistances[winId] = Math.max(0, (flightDistances[winId] || 0) + amt);
      const inp = document.getElementById(`ew-pos-input-${winId}`);
      if (inp) inp.value = Math.round(flightDistances[winId]);
    }

    function set3DDistance(winId) {
      const inp = document.getElementById(`ew-pos-input-${winId}`);
      if (inp) flightDistances[winId] = Math.max(0, parseFloat(inp.value) || 0);
    }

    /* Tasks Engine */
    let taskItems = [{ text: 'Fly to LoFi Station in 3D Emerald World', done: false }];
    function renderTaskList(winId) {
      const c = document.getElementById(`task-list-${winId}`);
      if (!c) return;
      c.innerHTML = '';
      taskItems.forEach((t, i) => {
        const item = document.createElement('div');
        item.style.cssText = 'background:#0f172a; padding:10px; border-radius:6px; display:flex; justify-content:space-between; border:1px solid var(--border);';
        item.innerHTML = `<span>${t.text}</span><button class="browser-btn" onclick="taskItems.splice(${i},1); renderTaskList('${winId}')">Remove</button>`;
        c.appendChild(item);
      });
    }
    function addTask(winId) {
      const inp = document.getElementById(`task-in-${winId}`);
      if (inp.value) { taskItems.push({ text: inp.value, done: false }); inp.value = ''; renderTaskList(winId); }
    }

    /* Paint Engine */
    function initPaintCanvas(winId) {
      setTimeout(() => {
        const canvas = document.getElementById(`paint-canv-${winId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let draw = false;
        canvas.onmousedown = () => draw = true;
        canvas.onmouseup = () => { draw = false; ctx.beginPath(); };
        canvas.onmousemove = (e) => {
          if (!draw) return;
          const rect = canvas.getBoundingClientRect();
          ctx.lineWidth = 4; ctx.lineCap = 'round';
          ctx.strokeStyle = document.getElementById(`paint-col-${winId}`).value;
          ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
          ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        };
      }, 100);
    }
    function clearCanvas(winId) {
      const canvas = document.getElementById(`paint-canv-${winId}`);
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    /* Terminal Cmds */
    function runTermCmd(winId) {
      const inp = document.getElementById(`term-in-${winId}`);
      const out = document.getElementById(`term-out-${winId}`);
      const cmd = inp.value.trim().toLowerCase();
      out.innerHTML += `<br>$ ${inp.value}`;
      if (cmd === 'help') out.innerHTML += '<br>Commands: help, 3d, lofi, clear, matrix';
      else if (cmd === '3d') openApp('emeraldworld');
      else if (cmd === 'lofi') openApp('lofi');
      else if (cmd === 'clear') out.innerHTML = '';
      else if (cmd === 'matrix') triggerMatrixEffect();
      else out.innerHTML += `<br>Unknown command: ${cmd}`;
      inp.value = '';
    }

    /* Photos Wallpaper */
    function uploadPhotos(winId) {
      const input = document.createElement('input'); input.type = 'file'; input.multiple = true; input.accept = 'image/*';
      input.onchange = (e) => {
        const grid = document.getElementById(`photo-grid-${winId}`);
        grid.innerHTML = '';
        Array.from(e.target.files).forEach(file => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const card = document.createElement('div'); card.className = 'app-card';
            card.innerHTML = `<img src="${ev.target.result}" style="width:100%; height:100px; object-fit:cover; border-radius:6px;"><button class="browser-btn" onclick="document.body.style.backgroundImage='url(${ev.target.result})'; showToast('Wallpaper updated!')">Set Wallpaper</button>`;
            grid.appendChild(card);
          };
          reader.readAsDataURL(file);
        });
      };
      input.click();
    }

    /* Matrix Effect */
    function triggerMatrixEffect() {
      stopAllAnimations();
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      const drops = Array(Math.floor(canvas.width / 20)).fill(1);
      matrixInterval = setInterval(() => {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#10b981'; ctx.font = '15px monospace';
        drops.forEach((y, i) => {
          ctx.fillText(Math.random() > 0.5 ? '1' : '0', i * 20, y * 20);
          if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        });
      }, 33);
      showToast('Matrix FX Activated');
    }

    renderDesktop();
  </script>
</body>
</html>
