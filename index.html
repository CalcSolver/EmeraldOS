<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald OS</title>
    <style>
        :root {
            --bg-base: #060c0a;
            --bg-surface: #0c1814;
            --bg-card: #12241e;
            --border: #1a382e;
            --accent: #00f097;
            --accent-dim: rgba(0, 240, 151, 0.15);
            --accent-glow: rgba(0, 240, 151, 0.35);
            --text-main: #ecfdf5;
            --text-sub: #6ee7b7;
            --taskbar-bg: rgba(6, 12, 10, 0.85);
            --danger: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-base); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Desktop Grid */
        .desktop { flex: 1; padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); grid-template-rows: repeat(auto-fill, minmax(100px, 1fr)); grid-auto-flow: column; gap: 12px; position: relative; }
        .desktop-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; text-align: center; border: 1px solid transparent; }
        .desktop-icon:hover { background: var(--accent-dim); border-color: var(--border); transform: translateY(-2px); box-shadow: 0 4px 12px var(--accent-glow); }
        .desktop-icon svg { width: 38px; height: 38px; fill: var(--accent); margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .desktop-icon span { font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.9); letter-spacing: 0.3px; }

        /* Windows Frame */
        .window { position: absolute; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 1px var(--accent); display: flex; flex-direction: column; min-width: 500px; min-height: 380px; overflow: hidden; z-index: 10; backdrop-filter: blur(10px); }
        .window-header { background: rgba(12, 24, 20, 0.9); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); cursor: move; }
        .window-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13px; color: var(--accent); letter-spacing: 0.5px; }
        .window-title svg { width: 18px; height: 18px; fill: var(--accent); }
        .window-controls { display: flex; gap: 8px; }
        .win-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: 0.2s; }
        .win-btn:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
        .win-btn.close:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
        .window-body { flex: 1; display: flex; overflow: hidden; }

        /* Sidebar UI */
        .app-sidebar { width: 200px; background: rgba(6, 12, 10, 0.5); border-right: 1px solid var(--border); padding: 14px 10px; display: flex; flex-direction: column; gap: 6px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; color: var(--text-sub); cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--border); }
        .app-content { flex: 1; padding: 24px; overflow-y: auto; background: var(--bg-base); }

        /* Taskbar */
        .taskbar { height: 50px; background: var(--taskbar-bg); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; backdrop-filter: blur(12px); }
        .start-btn { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 800; color: #000; background: var(--accent); box-shadow: 0 0 12px var(--accent-glow); transition: 0.2s; }
        .start-btn:hover { transform: scale(1.03); }
        .taskbar-dock { display: flex; gap: 8px; flex: 1; margin: 0 20px; overflow-x: auto; }
        .dock-item { padding: 6px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--text-sub); transition: 0.2s; }
        .dock-item:hover, .dock-item.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

        /* Custom JavaScript Console/Menu App */
        .js-console { background: #030705; color: var(--accent); font-family: 'Consolas', 'Fira Code', monospace; padding: 14px; flex: 1; display: flex; flex-direction: column; font-size: 13px; }
        .console-logs { flex: 1; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; padding-bottom: 10px; }
        .console-input { display: flex; gap: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
        .console-input input { background: transparent; border: none; color: var(--text-main); outline: none; flex: 1; font-family: monospace; font-size: 13px; }

        /* Buttons & Cards */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 10px var(--accent-glow); }
    </style>
</head>
<body>

    <!-- Emerald OS Workspace -->
    <div class="desktop" id="desktop"></div>

    <!-- Active Taskbar -->
    <div class="taskbar">
        <div class="start-btn" onclick="openApp('App Store')">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5zm0 9L2 6v11l10 5 10-5V6l-10 5z"/></svg>
            Emerald
        </div>
        <div class="taskbar-dock" id="taskbar-dock"></div>
        <div id="clock" style="font-size: 13px; font-weight: 700; color: var(--accent);">12:00 PM</div>
    </div>

    <script>
        // System State
        const state = {
            use12Hour: true,
            showSeconds: true,
            activeWindows: {}
        };

        // Core App Registry for Emerald OS
        const apps = [
            { id: "store", name: "App Store", icon: '<path d="M19 4h-4c0-1.1-.9-2-2-2h-2c-1.1 0-2 .9-2 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-7 0h2v2h-2V4z"/>' },
            { id: "jsmenu", name: "JS Menu Console", icon: '<path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>' },
            { id: "settings", name: "Settings", icon: '<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>' },
            { id: "files", name: "Emerald Files", icon: '<path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>' },
            { id: "calc", name: "Calculator", icon: '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4 14h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2zm-4 8H9v-2h2v2zm0-4H9v-2h2v2zm0-4H9V7h2v2z"/>' }
        ];

        // Desktop Grid Rendering
        function renderDesktop() {
            const grid = document.getElementById('desktop');
            grid.innerHTML = '';
            apps.forEach(app => {
                const icon = document.createElement('div');
                icon.className = 'desktop-icon';
                icon.onclick = () => openApp(app.name);
                icon.innerHTML = `<svg viewBox="0 0 24 24">${app.icon}</svg><span>${app.name}</span>`;
                grid.appendChild(icon);
            });
        }

        // Window & Dock System
        function openApp(appName) {
            if (state.activeWindows[appName]) {
                const win = state.activeWindows[appName];
                win.style.display = 'flex';
                focusWindow(win);
                updateTaskbar();
                return;
            }

            const appData = apps.find(a => a.name === appName) || { icon: '<path d="M12 2L2 7l10 5 10-5-10-5z"/>' };
            const win = document.createElement('div');
            win.className = 'window';
            win.style.left = `${80 + Object.keys(state.activeWindows).length * 25}px`;
            win.style.top = `${60 + Object.keys(state.activeWindows).length * 25}px`;
            win.style.width = appName === 'App Store' ? '750px' : '550px';
            win.style.height = '420px';

            win.innerHTML = `
                <div class="window-header">
                    <div class="window-title"><svg viewBox="0 0 24 24">${appData.icon}</svg>${appName}</div>
                    <div class="window-controls">
                        <button class="win-btn" onclick="toggleMinimize('${appName}')">—</button>
                        <button class="win-btn close" onclick="closeWindow('${appName}')">✕</button>
                    </div>
                </div>
                <div class="window-body">${renderAppView(appName)}</div>
            `;

            win.onmousedown = () => focusWindow(win);
            makeDraggable(win);
            document.body.appendChild(win);
            state.activeWindows[appName] = win;
            focusWindow(win);
            updateTaskbar();
        }

        function focusWindow(win) {
            document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
            win.style.zIndex = 20;
        }

        function toggleMinimize(appName) {
            const win = state.activeWindows[appName];
            if (win) {
                win.style.display = win.style.display === 'none' ? 'flex' : 'none';
                if (win.style.display === 'flex') focusWindow(win);
                updateTaskbar();
            }
        }

        function closeWindow(appName) {
            if (state.activeWindows[appName]) {
                state.activeWindows[appName].remove();
                delete state.activeWindows[appName];
                updateTaskbar();
            }
        }

        function updateTaskbar() {
            const dock = document.getElementById('taskbar-dock');
            dock.innerHTML = '';
            Object.keys(state.activeWindows).forEach(appName => {
                const item = document.createElement('div');
                const win = state.activeWindows[appName];
                item.className = `dock-item ${win.style.display !== 'none' ? 'active' : ''}`;
                item.innerText = appName;
                item.onclick = () => toggleMinimize(appName);
                dock.appendChild(item);
            });
        }

        // Internal App Renderer
        function renderAppView(appName) {
            if (appName === 'JS Menu Console') {
                return `
                    <div class="js-console">
                        <div class="console-logs" id="js-logs">Emerald OS Live JS Engine\nType Javascript commands below or run system routines.\nTry: 'Emerald.version', 'Emerald.theme("light")', or 'console.log("Hello Emerald")'\n</div>
                        <div class="console-input">
                            <span>&gt;</span>
                            <input type="text" placeholder="Execute JavaScript code..." onkeydown="evalJS(event, this)">
                        </div>
                    </div>
                `;
            } else if (appName === 'App Store') {
                return `
                    <div class="app-sidebar">
                        <div class="nav-item active" onclick="switchStoreTab(this, 'all')">All Emerald Apps</div>
                        <div class="nav-item" onclick="switchStoreTab(this, 'tools')">Developer Tools</div>
                    </div>
                    <div class="app-content" id="store-view">
                        ${renderStoreCategory('all')}
                    </div>
                `;
            } else if (appName === 'Settings') {
                return `
                    <div class="app-content">
                        <h2 style="color:var(--accent); margin-bottom:15px;">Emerald Configuration</h2>
                        <p style="color:var(--text-sub);">Custom settings engine for Emerald OS build 1.0.</p>
                    </div>
                `;
            }
            return `<div style="padding:20px; color:var(--text-sub);">${appName} core modules initialized smoothly.</div>`;
        }

        // Store Switching
        function switchStoreTab(el, cat) {
            document.querySelectorAll('.app-sidebar .nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('store-view').innerHTML = renderStoreCategory(cat);
        }

        function renderStoreCategory(cat) {
            return `
                <div class="card-grid">
                    <div class="card">
                        <h4>JS Menu Console</h4>
                        <p style="font-size:12px; color:var(--text-sub)">Direct JavaScript access and system API console.</p>
                        <button class="btn" onclick="openApp('JS Menu Console')">Launch</button>
                    </div>
                    <div class="card">
                        <h4>Emerald Files</h4>
                        <p style="font-size:12px; color:var(--text-sub)">Local storage file browser system.</p>
                        <button class="btn" onclick="openApp('Emerald Files')">Launch</button>
                    </div>
                </div>
            `;
        }

        // Live JavaScript Executer (The JS Menu System)
        function evalJS(e, input) {
            if (e.key === 'Enter') {
                const logs = document.getElementById('js-logs');
                const code = input.value;
                logs.innerText += `\n> ${code}`;
                try {
                    const result = eval(code);
                    logs.innerText += `\n< ${result}`;
                } catch (err) {
                    logs.innerText += `\n[Error] ${err.message}`;
                }
                input.value = '';
                logs.scrollTop = logs.scrollHeight;
            }
        }

        // Global Emerald API exposed to the JS Menu
        window.Emerald = {
            version: "Emerald OS v1.0.0 (Custom Build)",
            theme: (mode) => {
                document.documentElement.setAttribute('data-theme', mode);
                return `Theme set to ${mode}`;
            },
            apps: () => apps.map(a => a.name)
        };

        // Window Dragger
        function makeDraggable(elmnt) {
            let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
            const header = elmnt.querySelector('.window-header');
            if (header) header.onmousedown = (e) => {
                e.preventDefault();
                p3 = e.clientX; p4 = e.clientY;
                document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
                document.onmousemove = (e) => {
                    e.preventDefault();
                    p1 = p3 - e.clientX; p2 = p4 - e.clientY;
                    p3 = e.clientX; p4 = e.clientY;
                    elmnt.style.top = (elmnt.offsetTop - p2) + "px";
                    elmnt.style.left = (elmnt.offsetLeft - p1) + "px";
                };
            };
        }

        // Taskbar Clock Cycle
        setInterval(() => {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').innerText = `${h}:${m}:${s} ${ampm}`;
        }, 1000);

        renderDesktop();
    </script>
</body>
</html>
