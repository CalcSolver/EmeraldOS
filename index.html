<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NautilusOS v5.0</title>
  <style>
    /* Theme Definitions */
    :root {
      --bg-gradient: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      --accent: #10b981;
      --accent-hover: #059669;
      --panel-bg: rgba(15, 23, 42, 0.9);
      --window-bg: rgba(30, 41, 59, 0.95);
      --text: #f8fafc;
      --border: rgba(255, 255, 255, 0.12);
      --term-text: #38bdf8;
    }

    [data-theme="cyberpunk"] {
      --bg-gradient: radial-gradient(circle at center, #2b0938 0%, #0c0214 100%);
      --accent: #f43f5e;
      --panel-bg: rgba(43, 9, 56, 0.9);
      --window-bg: rgba(24, 9, 38, 0.95);
      --term-text: #facc15;
    }

    [data-theme="synthwave"] {
      --bg-gradient: linear-gradient(135deg, #18022b 0%, #080014 100%);
      --accent: #d946ef;
      --panel-bg: rgba(24, 2, 43, 0.9);
      --window-bg: rgba(38, 8, 64, 0.95);
      --term-text: #22d3ee;
    }

    [data-theme="nord"] {
      --bg-gradient: radial-gradient(circle at center, #3b4252 0%, #2e3440 100%);
      --accent: #88c0d0;
      --panel-bg: rgba(46, 52, 64, 0.9);
      --window-bg: rgba(59, 66, 82, 0.95);
      --term-text: #a3be8c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-gradient); height: 100vh; overflow: hidden; color: var(--text); transition: background 0.4s ease; }

    /* Auth Overlay */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(16px);
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: var(--window-bg);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 12px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      text-align: center;
    }

    .auth-input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    .auth-btn {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .auth-btn:hover { opacity: 0.9; }
    .auth-btn.secondary { background: #334155; color: #fff; }
    .auth-btn.google { background: #ea4335; color: #fff; }

    /* Desktop Area */
    #desktop {
      width: 100vw;
      height: calc(100vh - 48px);
      position: relative;
      padding: 20px;
    }

    .icon {
      width: 92px;
      height: 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      position: absolute;
      transition: border 0.2s, background 0.2s;
      border: 1px solid transparent;
    }

    .icon:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--border); }
    body.drag-mode-active .icon { cursor: move; border-color: var(--accent); background: rgba(16, 185, 129, 0.15); }
    .icon-svg { width: 42px; height: 42px; fill: var(--accent); pointer-events: none; }
    .icon-label { font-size: 11px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8); pointer-events: none; line-height: 1.2; }

    /* Window System */
    .window {
      position: absolute;
      width: 820px;
      height: 530px;
      background: var(--window-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .window-header {
      height: 38px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      cursor: move;
      border-bottom: 1px solid var(--border);
    }

    .window-controls { display: flex; gap: 8px; }
    .control-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
    .btn-close { background: #ef4444; }
    .btn-min { background: #f59e0b; }
    .btn-max { background: var(--accent); }

    .window-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #080c14; position: relative; }
    .app-container { padding: 18px; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    .browser-bar { display: flex; gap: 8px; padding: 10px; background: #111827; border-bottom: 1px solid var(--border); align-items: center; }
    .browser-btn { background: #1f2937; border: 1px solid var(--border); color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .browser-btn:hover { background: var(--accent); color: #000; }
    .browser-input { flex: 1; background: #1f2937; border: 1px solid var(--border); color: #fff; padding: 7px 12px; border-radius: 6px; font-size: 13px; outline: none; }

    .code-editor { flex: 1; background: #020617; color: var(--term-text); font-family: 'Consolas', monospace; padding: 12px; border: 1px solid var(--border); border-radius: 6px; outline: none; resize: none; font-size: 13px; }
    .preview-frame { flex: 1; background: #ffffff; border: 1px solid var(--border); border-radius: 6px; }

    /* Taskbar Engine */
    #taskbar { height: 48px; background: var(--panel-bg); border-top: 1px solid var(--border); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; position: absolute; bottom: 0; width: 100vw; z-index: 1000; }
    .taskbar-left { display: flex; align-items: center; gap: 10px; flex: 1; overflow-x: auto; }
    .start-btn { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .taskbar-item { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    #start-menu { position: absolute; bottom: 58px; left: 12px; width: 320px; max-height: 480px; overflow-y: auto; background: var(--window-bg); border: 1px solid var(--border); border-radius: 10px; backdrop-filter: blur(20px); padding: 12px; display: none; flex-direction: column; gap: 6px; z-index: 1001; }
    .menu-item { padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; }
    .menu-item:hover { background: rgba(255, 255, 255, 0.1); }

    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--accent); color: #000; padding: 12px 20px; border-radius: 8px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
  </style>
</head>
<body>

  <div id="auth-overlay">
    <div class="auth-card">
      <h2 style="color: var(--accent);">⚡ NautilusOS Login</h2>
      <p style="font-size: 12px; color: #94a3b8;">Sign in to sync your desktop settings</p>
      
      <input type="email" id="auth-email" class="auth-input" placeholder="Email address">
      <input type="password" id="auth-password" class="auth-input" placeholder="Password">
      
      <button class="auth-btn" id="btn-login-email">Sign In with Email</button>
      <button class="auth-btn secondary" id="btn-signup-email">Create Account</button>
      <button class="auth-btn google" id="btn-login-google">Sign In with Google</button>
      
      <hr style="border-color: var(--border); margin: 4px 0;">
      <button class="auth-btn secondary" id="btn-login-guest">Continue as Guest</button>
    </div>
  </div>

  <div id="toast-container"></div>
  <div id="desktop"></div>

  <div id="start-menu"></div>

  <div id="taskbar">
    <div class="taskbar-left">
      <button class="start-btn" onclick="toggleStartMenu()">⚡ NautilusOS</button>
      <button class="browser-btn" id="drag-mode-toggle" onclick="toggleGlobalDragMode()">🖐️ Drag Mode: OFF</button>
      <div id="running-tasks" style="display:flex; gap:6px;"></div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span id="user-badge" style="font-size: 12px; color: var(--accent); font-weight: bold;">Guest</span>
      <button class="browser-btn" style="padding: 4px 8px;" id="btn-logout">Logout</button>
      <div id="clock">12:00 PM</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signInAnonymously, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHalkE8dB7TycHSrBrkZ65fZ_G6aE465c",
      authDomain: "emulator-35ec5.firebaseapp.com",
      projectId: "emulator-35ec5",
      storageBucket: "emulator-35ec5.firebasestorage.app",
      messagingSenderId: "358755516525",
      appId: "1:358755516525:web:d4d141dfb91b5418b4bf64",
      measurementId: "G-HSD9VV55L5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // Attach Handlers
    document.getElementById('btn-login-email').onclick = () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      signInWithEmailAndPassword(auth, email, password).catch(err => alert(err.message));
    };

    document.getElementById('btn-signup-email').onclick = () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      createUserWithEmailAndPassword(auth, email, password).catch(err => alert(err.message));
    };

    document.getElementById('btn-login-google').onclick = () => {
      signInWithPopup(auth, googleProvider).catch(err => alert(err.message));
    };

    document.getElementById('btn-login-guest').onclick = () => {
      signInAnonymously(auth).catch(err => alert(err.message));
    };

    document.getElementById('btn-logout').onclick = () => {
      signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      const overlay = document.getElementById('auth-overlay');
      const userBadge = document.getElementById('user-badge');

      if (user) {
        overlay.style.display = 'none';
        userBadge.innerText = user.isAnonymous ? '👤 Guest' : `👤 ${user.email || user.displayName}`;
        showToast(`Welcome ${user.email || 'Guest'}!`);
      } else {
        overlay.style.display = 'flex';
      }
    });
  </script>

  <script>
    /* Desktop OS Engine */
    const baseAppsCatalog = [
      { id: 'browser', name: 'Nautilus Search', category: 'Starter', icon: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>' },
      { id: 'htmlviewer', name: 'HTML Viewer', category: 'Developer', icon: '<path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>' },
      { id: 'files', name: 'File Explorer', category: 'Utilities', icon: '<path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>' },
      { id: 'settings', name: 'Settings', category: 'Starter', icon: '<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>' }
    ];

    let installedApps = ['browser', 'htmlviewer', 'files', 'settings'];
    let fileSystem = JSON.parse(localStorage.getItem('nautilus_files')) || { 'index.html': '<h1>Hello NautilusOS!</h1>' };
    let openWindows = {};
    let activeZIndex = 100;
    let globalDragMode = false;

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function updateClock() {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function toggleGlobalDragMode() {
      globalDragMode = !globalDragMode;
      document.body.classList.toggle('drag-mode-active', globalDragMode);
    }

    function renderDesktop() {
      const desktop = document.getElementById('desktop');
      desktop.innerHTML = '';
      let defaultX = 20, defaultY = 20;

      installedApps.forEach(appId => {
        const app = baseAppsCatalog.find(a => a.id === appId);
        if (!app) return;

        const icon = document.createElement('div');
        icon.className = 'icon';
        icon.style.left = `${defaultX}px`;
        icon.style.top = `${defaultY}px`;
        icon.innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24">${app.icon}</svg><span class="icon-label">${app.name}</span>`;
        icon.ondblclick = () => openApp(app.id);

        desktop.appendChild(icon);
        defaultY += 105;
      });
    }

    function openApp(appId) {
      if (openWindows[appId]) {
        const existingWin = document.getElementById(openWindows[appId]);
        if (existingWin) {
          existingWin.style.display = 'flex';
          existingWin.style.zIndex = ++activeZIndex;
          return;
        }
      }

      const winId = 'win-' + Date.now();
      openWindows[appId] = winId;
      const appObj = baseAppsCatalog.find(a => a.id === appId);

      const win = document.createElement('div');
      win.className = 'window';
      win.id = winId;
      win.style.top = '60px';
      win.style.left = '80px';
      win.style.zIndex = ++activeZIndex;

      win.innerHTML = `
        <div class="window-header">
          <div class="window-title">⚡ ${appObj ? appObj.name : 'App'}</div>
          <div class="window-controls">
            <button class="control-btn btn-close" onclick="document.getElementById('${winId}').remove(); delete openWindows['${appId}'];"></button>
          </div>
        </div>
        <div class="window-content" style="padding:16px;">
          <h3>${appObj.name}</h3>
          <p>Application active and ready.</p>
        </div>
      `;

      document.body.appendChild(win);
    }

    renderDesktop();
  </script>
</body>
</html>
