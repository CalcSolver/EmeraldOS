<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmeraldOS</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #064e3b 0%, #022c22 100%);
      --accent-color: #10b981;
      --accent-hover: #059669;
      --panel-bg: rgba(16, 24, 20, 0.85);
      --window-bg: rgba(20, 30, 25, 0.95);
      --text-color: #ecfdf5;
      --border-color: rgba(16, 185, 129, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      height: 100vh;
      overflow: hidden;
      color: var(--text-color);
      transition: background 0.3s ease;
    }

    /* Desktop */
    #desktop {
      width: 100vw;
      height: calc(100vh - 48px);
      position: relative;
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 20px;
    }

    .icon {
      width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      padding: 10px;
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .icon:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .icon-svg {
      width: 44px;
      height: 44px;
      fill: var(--accent-color);
    }

    .icon-label {
      font-size: 12px;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* Windows */
    .window {
      position: absolute;
      width: 820px;
      height: 520px;
      background: var(--window-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 340px;
      min-height: 220px;
      z-index: 10;
    }

    .window-header {
      height: 38px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      cursor: move;
      border-bottom: 1px solid var(--border-color);
    }

    .window-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .control-btn {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .btn-close { background: #ef4444; }
    .btn-min { background: #f59e0b; }
    .btn-max { background: var(--accent-color); }

    .window-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    /* Browser UI */
    .browser-bar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #111827;
      border-bottom: 1px solid #374151;
      align-items: center;
    }

    .browser-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .browser-btn:hover { background: #374151; }

    .browser-input {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .browser-viewport {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }

    .browser-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    .browser-home {
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 20px;
    }

    .home-logo {
      font-size: 42px;
      font-weight: 700;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .home-search-box {
      display: flex;
      width: 100%;
      max-width: 550px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 30px;
      padding: 6px 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .home-search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      padding: 8px;
    }

    .home-search-btn {
      background: var(--accent-color);
      border: none;
      color: #000;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* Terminal */
    .terminal-container {
      background: #090d16;
      color: #38bdf8;
      font-family: 'Consolas', 'Courier New', monospace;
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    .terminal-output {
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .terminal-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .terminal-prompt {
      color: var(--accent-color);
      font-weight: bold;
    }

    .terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
    }

    /* Common App View */
    .app-container {
      padding: 20px;
      background: #0f172a;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Store Grid */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .store-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    /* Taskbar */
    #taskbar {
      height: 48px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      position: absolute;
      bottom: 0;
      width: 100vw;
      z-index: 1000;
    }

    .start-btn {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    #start-menu {
      position: absolute;
      bottom: 58px;
      left: 12px;
      width: 280px;
      background: var(--window-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      backdrop-filter: blur(20px);
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 1001;
    }

    .menu-item {
      padding: 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .menu-item:hover { background: rgba(16, 185, 129, 0.15); }

    /* Notifications */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #10b981;
      color: #000;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div id="desktop">
    <div class="icon" onclick="openApp('browser')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      <span class="icon-label">Emerald Browser</span>
    </div>
    <div class="icon" onclick="openApp('terminal')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.11-.9-2-2-2zm0 14H4V8h16v10zm-2-1h-6v-2h6v2zm-9.41-1.41L11.17 13l-2.58-2.59L10 9l4 4-4 4-1.41-1.41z"/></svg>
      <span class="icon-label">Terminal</span>
    </div>
    <div class="icon" onclick="openApp('settings')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></svg>
      <span class="icon-label">Settings</span>
    </div>
    <div class="icon" onclick="openApp('store')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12z"/></svg>
      <span class="icon-label">App Store</span>
    </div>
  </div>

  <div id="start-menu">
    <div class="menu-item" onclick="openApp('browser'); toggleStartMenu();">🌐 Emerald Browser</div>
    <div class="menu-item" onclick="openApp('terminal'); toggleStartMenu();">💻 Terminal</div>
    <div class="menu-item" onclick="openApp('settings'); toggleStartMenu();">⚙️ Settings</div>
    <div class="menu-item" onclick="openApp('store'); toggleStartMenu();">🛍️ App Store</div>
  </div>

  <div id="taskbar">
    <button class="start-btn" onclick="toggleStartMenu()">💎 Emerald</button>
    <div id="clock">12:00 PM</div>
  </div>

  <script>
    // Search Engine State
    let currentSearchEngine = 'duckduckgo';
    const searchEngines = {
      duckduckgo: { name: 'DuckDuckGo', url: 'https://html.duckduckgo.com/html/?q=' },
      bing: { name: 'Bing', url: 'https://www.bing.com/search?q=' },
      google: { name: 'Google', url: 'https://www.google.com/search?q=' },
      yahoo: { name: 'Yahoo', url: 'https://search.yahoo.com/search?p=' }
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    let activeZIndex = 100;

    function openApp(appType, customUrl) {
      const windowId = 'win-' + Date.now();
      let title = 'Application';
      let content = '';

      if (appType === 'browser') {
        title = 'Emerald Browser';
        content = `
          <div class="browser-bar">
            <button class="browser-btn" onclick="goHome('${windowId}')">🏠</button>
            <button class="browser-btn" onclick="reloadFrame('${windowId}')">↻</button>
            <input type="text" class="browser-input" id="url-${windowId}" value="emerald://home" onkeydown="if(event.key==='Enter') navigateFrame('${windowId}')">
            <button class="browser-btn" onclick="navigateFrame('${windowId}')">Go</button>
            <button class="browser-btn" title="Open in outer window" onclick="openExternal('${windowId}')">↗</button>
          </div>
          <div class="browser-viewport" id="viewport-${windowId}">
            ${getHomeMarkup(windowId)}
          </div>
        `;
      } else if (appType === 'ultraviolet') {
        title = 'Ultraviolet Wasm Core';
        content = `
          <div class="app-container">
            <h2>🔮 Ultraviolet WebAssembly Core</h2>
            <div style="background:#1e293b; border:1px solid #334155; padding:16px; border-radius:8px; display:flex; flex-direction:column; gap:10px;">
              <p><strong>Proxy Status:</strong> <span style="color:#10b981;">Active (libcurl/Wasm Interceptor)</span></p>
              <p>Ultraviolet proxy module bypasses header restrictions by fetching web resources via a WebAssembly proxy worker into isolated frame contexts.</p>
              <div style="display:flex; gap:10px; margin-top:10px;">
                <input type="text" id="uv-target-${windowId}" class="browser-input" placeholder="Enter target URL (e.g. example.com)">
                <button class="browser-btn" onclick="launchUVProxy('${windowId}')">Launch via UV Proxy</button>
              </div>
            </div>
          </div>
        `;
      } else if (appType === 'terminal') {
        title = 'Terminal';
        content = `
          <div class="terminal-container" id="term-container-${windowId}">
            <div class="terminal-output" id="term-out-${windowId}">EmeraldOS Terminal v2.5\nType "help" for commands.\n</div>
            <div class="terminal-input-row">
              <span class="terminal-prompt">emerald@user:~$</span>
              <input type="text" class="terminal-input" id="term-in-${windowId}" onkeydown="handleTerminalKey(event, '${windowId}')" autofocus>
            </div>
          </div>
        `;
      } else if (appType === 'settings') {
        title = 'Settings';
        content = renderSettingsContent();
      } else if (appType === 'store') {
        title = 'App Store';
        content = `
          <div class="app-container">
            <div class="store-grid">
              <div class="store-card">
                <div style="font-size:36px">🔮</div>
                <h3>Ultraviolet</h3>
                <p>Wasm Web Proxy & Interceptor</p>
                <button class="browser-btn" onclick="openApp('ultraviolet')">Launch</button>
              </div>
              <div class="store-card">
                <div style="font-size:36px">📚</div>
                <h3>Wikipedia</h3>
                <p>Free Encyclopedia</p>
                <button class="browser-btn" onclick="openApp('browser', 'https://wikipedia.org')">Launch</button>
              </div>
              <div class="store-card">
                <div style="font-size:36px">🎮</div>
                <h3>2048 Game</h3>
                <p>Puzzle Game</p>
                <button class="browser-btn" onclick="openApp('browser', 'https://play2048.co')">Launch</button>
              </div>
            </div>
          </div>
        `;
      }

      const win = document.createElement('div');
      win.className = 'window';
      win.id = windowId;
      win.style.top = '70px';
      win.style.left = '90px';
      win.style.zIndex = ++activeZIndex;

      win.innerHTML = `
        <div class="window-header" onmousedown="dragWindow(event, '${windowId}')">
          <div class="window-title">💎 ${title}</div>
          <div class="window-controls">
            <button class="control-btn btn-min" onclick="minimizeWindow('${windowId}')"></button>
            <button class="control-btn btn-max" onclick="maximizeWindow('${windowId}')"></button>
            <button class="control-btn btn-close" onclick="closeWindow('${windowId}')"></button>
          </div>
        </div>
        <div class="window-content">${content}</div>
      `;

      win.addEventListener('mousedown', () => win.style.zIndex = ++activeZIndex);
      document.body.appendChild(win);

      if (customUrl && appType === 'browser') {
        document.getElementById(`url-${windowId}`).value = customUrl;
        navigateFrame(windowId);
      }
    }

    function closeWindow(id) { document.getElementById(id).remove(); }
    function minimizeWindow(id) { document.getElementById(id).style.display = 'none'; }
    
    function maximizeWindow(id) {
      const win = document.getElementById(id);
      if (win.style.width === '100vw') {
        win.style.width = '820px';
        win.style.height = '520px';
        win.style.top = '70px';
        win.style.left = '90px';
      } else {
        win.style.width = '100vw';
        win.style.height = 'calc(100vh - 48px)';
        win.style.top = '0';
        win.style.left = '0';
      }
    }

    function dragWindow(e, id) {
      const win = document.getElementById(id);
      let shiftX = e.clientX - win.getBoundingClientRect().left;
      let shiftY = e.clientY - win.getBoundingClientRect().top;

      function moveAt(pageX, pageY) {
        win.style.left = pageX - shiftX + 'px';
        win.style.top = pageY - shiftY + 'px';
      }

      function onMouseMove(event) { moveAt(event.clientX, event.clientY); }
      document.addEventListener('mousemove', onMouseMove);
      document.onmouseup = function() {
        document.removeEventListener('mousemove', onMouseMove);
        document.onmouseup = null;
      };
    }

    /* Settings HTML Builder */
    function renderSettingsContent() {
      return `
        <div class="app-container">
          <h2>System Settings</h2>
          <div style="background:#1e293b; border:1px solid #334155; padding:16px; border-radius:8px; display:flex; flex-direction:column; gap:12px;">
            <h3>Default Search Engine</h3>
            <div style="display:flex; gap:10px; align-items:center;">
              <select id="engine-select" class="browser-input" onchange="changeSearchEngine(this.value)">
                <option value="duckduckgo" ${currentSearchEngine === 'duckduckgo' ? 'selected' : ''}>DuckDuckGo</option>
                <option value="bing" ${currentSearchEngine === 'bing' ? 'selected' : ''}>Bing</option>
                <option value="google" ${currentSearchEngine === 'google' ? 'selected' : ''}>Google</option>
                <option value="yahoo" ${currentSearchEngine === 'yahoo' ? 'selected' : ''}>Yahoo</option>
              </select>
            </div>
          </div>
          <div style="background:#1e293b; border:1px solid #334155; padding:16px; border-radius:8px; display:flex; flex-direction:column; gap:12px;">
            <h3>Appearance</h3>
            <div style="display:flex; gap:10px;">
              <button class="browser-btn" onclick="setTheme('emerald')">Emerald Green</button>
              <button class="browser-btn" onclick="setTheme('sapphire')">Sapphire Blue</button>
              <button class="browser-btn" onclick="setTheme('ruby')">Ruby Red</button>
            </div>
          </div>
        </div>
      `;
    }

    function changeSearchEngine(engineKey) {
      if (searchEngines[engineKey]) {
        currentSearchEngine = engineKey;
        showToast(`Search engine set to ${searchEngines[engineKey].name}`);
      }
    }

    /* Browser Engine */
    function getHomeMarkup(winId) {
      return `
        <div class="browser-home">
          <div class="home-logo">💎 Emerald Search</div>
          <div class="home-search-box">
            <input type="text" class="home-search-input" id="home-input-${winId}" placeholder="Search web with ${searchEngines[currentSearchEngine].name} or type URL..." onkeydown="if(event.key==='Enter') executeHomeSearch('${winId}')">
            <button class="home-search-btn" onclick="executeHomeSearch('${winId}')">Search</button>
          </div>
        </div>
      `;
    }

    function goHome(winId) {
      const viewport = document.getElementById(`viewport-${winId}`);
      const input = document.getElementById(`url-${winId}`);
      input.value = "emerald://home";
      viewport.innerHTML = getHomeMarkup(winId);
    }

    function executeHomeSearch(winId) {
      const query = document.getElementById(`home-input-${winId}`).value.trim();
      if (!query) return;

      const urlInput = document.getElementById(`url-${winId}`);
      if (query.includes('.') && !query.includes(' ')) {
        urlInput.value = query;
      } else {
        urlInput.value = searchEngines[currentSearchEngine].url + encodeURIComponent(query);
      }
      navigateFrame(winId);
    }

    async function navigateFrame(winId) {
      const input = document.getElementById(`url-${winId}`);
      const viewport = document.getElementById(`viewport-${winId}`);
      let url = input.value.trim();

      if (url === 'emerald://home' || url === 'home') {
        goHome(winId);
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      input.value = url;

      viewport.innerHTML = `<iframe id="frame-${winId}" class="browser-frame" src="${url}"></iframe>`;
    }

    function reloadFrame(winId) { navigateFrame(winId); }

    function openExternal(winId) {
      const input = document.getElementById(`url-${winId}`);
      window.open(input.value, '_blank');
    }

    function launchUVProxy(winId) {
      const targetInput = document.getElementById(`uv-target-${winId}`);
      let targetUrl = targetInput.value.trim();
      if (!targetUrl) return;

      openApp('browser', targetUrl);
    }

    /* Terminal */
    function handleTerminalKey(event, winId) {
      if (event.key === 'Enter') {
        const inputElem = document.getElementById(`term-in-${winId}`);
        const outputElem = document.getElementById(`term-out-${winId}`);
        const command = inputElem.value.trim();
        inputElem.value = '';

        outputElem.innerText += `\nemerald@user:~$ ${command}\n`;
        const args = command.split(' ');
        const cmd = args[0].toLowerCase();

        switch (cmd) {
          case 'help':
            outputElem.innerText += `Commands: help, clear, echo, date, ver, uv <url>\n`;
            break;
          case 'clear':
            outputElem.innerText = '';
            break;
          case 'echo':
            outputElem.innerText += `${args.slice(1).join(' ')}\n`;
            break;
          case 'date':
            outputElem.innerText += `${new Date().toString()}\n`;
            break;
          case 'ver':
            outputElem.innerText += `EmeraldOS v2.5 (Ultraviolet Wasm Core)\n`;
            break;
          case 'uv':
            const url = args[1];
            if (url) {
              openApp('browser', url);
              outputElem.innerText += `Routing ${url} through Wasm browser...\n`;
            } else {
              outputElem.innerText += `Usage: uv <url>\n`;
            }
            break;
          default:
            if (cmd) outputElem.innerText += `Command not found: ${cmd}\n`;
        }

        const container = document.getElementById(`term-container-${winId}`);
        container.scrollTop = container.scrollHeight;
      }
    }

    /* Theme Changer */
    function setTheme(theme) {
      const root = document.documentElement;
      if (theme === 'emerald') {
        root.style.setProperty('--bg-gradient', 'radial-gradient(circle at center, #064e3b 0%, #022c22 100%)');
        root.style.setProperty('--accent-color', '#10b981');
      } else if (theme === 'sapphire') {
        root.style.setProperty('--bg-gradient', 'radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%)');
        root.style.setProperty('--accent-color', '#3b82f6');
      } else if (theme === 'ruby') {
        root.style.setProperty('--bg-gradient', 'radial-gradient(circle at center, #881337 0%, #18181b 100%)');
        root.style.setProperty('--accent-color', '#f43f5e');
      }
    }
  </script>
</body>
</html>
