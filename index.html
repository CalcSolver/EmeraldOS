<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmeraldOS 3.0</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #064e3b 0%, #022c22 100%);
      --accent-color: #10b981;
      --accent-hover: #059669;
      --panel-bg: rgba(16, 24, 20, 0.85);
      --window-bg: rgba(20, 30, 25, 0.95);
      --text-color: #ecfdf5;
      --border-color: rgba(16, 185, 129, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      height: 100vh;
      overflow: hidden;
      color: var(--text-color);
      transition: background 0.3s ease;
    }

    /* Desktop Grid */
    #desktop {
      width: 100vw;
      height: calc(100vh - 48px);
      position: relative;
      padding: 20px;
      display: grid;
      grid-template-rows: repeat(auto-fill, 90px);
      grid-auto-flow: column;
      gap: 15px;
      overflow-x: auto;
    }

    .icon {
      width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .icon:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .icon-emoji {
      font-size: 32px;
    }

    .icon-label {
      font-size: 11px;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      word-break: break-word;
    }

    /* Window System */
    .window {
      position: absolute;
      width: 820px;
      height: 520px;
      background: var(--window-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 340px;
      min-height: 220px;
      z-index: 10;
    }

    .window-header {
      height: 38px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      cursor: move;
      border-bottom: 1px solid var(--border-color);
    }

    .window-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .control-btn {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .btn-close { background: #ef4444; }
    .btn-min { background: #f59e0b; }
    .btn-max { background: var(--accent-color); }

    .window-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    /* Browser Tab System */
    .browser-tabs {
      display: flex;
      background: #090d16;
      border-bottom: 1px solid #374151;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 6px 14px;
      background: #111827;
      border: none;
      border-right: 1px solid #374151;
      color: #9ca3af;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 160px;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: #1f2937;
      color: #fff;
      font-weight: bold;
    }

    .close-tab-btn {
      font-size: 10px;
      color: #ef4444;
      cursor: pointer;
      border-radius: 50%;
      padding: 0 4px;
    }

    .close-tab-btn:hover { background: rgba(239, 68, 68, 0.2); }

    .add-tab-btn {
      padding: 6px 12px;
      background: transparent;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      font-weight: bold;
    }

    /* Browser Navigation Bar */
    .browser-bar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #111827;
      border-bottom: 1px solid #374151;
      align-items: center;
    }

    .browser-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .browser-btn:hover { background: #374151; }

    .browser-input {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .browser-viewport {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }

    .browser-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    .browser-home {
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 20px;
    }

    .home-logo {
      font-size: 42px;
      font-weight: 700;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .home-search-box {
      display: flex;
      width: 100%;
      max-width: 550px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 30px;
      padding: 6px 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .home-search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      padding: 8px;
    }

    .home-search-btn {
      background: var(--accent-color);
      border: none;
      color: #000;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* Common App View */
    .app-container {
      padding: 20px;
      background: #0f172a;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* App Store Grid */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .store-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    /* Terminal */
    .terminal-container {
      background: #090d16;
      color: #38bdf8;
      font-family: 'Consolas', 'Courier New', monospace;
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    .terminal-output {
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .terminal-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .terminal-prompt {
      color: var(--accent-color);
      font-weight: bold;
    }

    .terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
    }

    /* Taskbar & Start Menu */
    #taskbar {
      height: 48px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      position: absolute;
      bottom: 0;
      width: 100vw;
      z-index: 1000;
    }

    .start-btn {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    #start-menu {
      position: absolute;
      bottom: 58px;
      left: 12px;
      width: 320px;
      max-height: 500px;
      overflow-y: auto;
      background: var(--window-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      backdrop-filter: blur(20px);
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 1001;
    }

    .menu-item {
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .menu-item:hover { background: rgba(16, 185, 129, 0.15); }

    /* Toast */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #10b981;
      color: #000;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div id="desktop"></div>

  <div id="start-menu"></div>

  <div id="taskbar">
    <button class="start-btn" onclick="toggleStartMenu()">💎 Emerald</button>
    <div id="clock">12:00 PM</div>
  </div>

  <script>
    /* Global System Configuration */
    let currentSearchEngine = 'duckduckgo';
    const searchEngines = {
      duckduckgo: { name: 'DuckDuckGo', url: 'https://html.duckduckgo.com/html/?q=' },
      bing: { name: 'Bing', url: 'https://www.bing.com/search?q=' },
      google: { name: 'Google', url: 'https://www.google.com/search?q=' },
      yahoo: { name: 'Yahoo', url: 'https://search.yahoo.com/search?p=' }
    };

    // System Apps Registry (20+ Apps)
    const systemApps = [
      { id: 'browser', name: 'Emerald Browser', icon: '🌐', category: 'System' },
      { id: 'terminal', name: 'Terminal', icon: '💻', category: 'System' },
      { id: 'notes', name: 'Persistent Notes', icon: '📝', category: 'Productivity' },
      { id: 'ultraviolet', name: 'Ultraviolet Wasm Core', icon: '🔮', category: 'Network' },
      { id: 'updates', name: 'System Updates Log', icon: '🚀', category: 'System' },
      { id: 'settings', name: 'Settings', icon: '⚙️', category: 'System' },
      { id: 'calc', name: 'Calculator', icon: '🧮', category: 'Utilities' },
      { id: 'paint', name: 'Emerald Paint Canvas', icon: '🎨', category: 'Utilities' },
      { id: 'weather', name: 'Weather Forecast', icon: '🌤️', category: 'Utilities' },
      { id: 'clockapp', name: 'Stopwatch & Clock', icon: '⏱️', category: 'Utilities' },
      { id: 'tictactoe', name: 'Tic-Tac-Toe', icon: '🎮', category: 'Games' },
      { id: 'snake', name: 'Snake Game', icon: '🐍', category: 'Games' },
      { id: 'quotes', name: 'Daily Quote Engine', icon: '💬', category: 'Utilities' },
      { id: 'taskmgr', name: 'Task Manager', icon: '📊', category: 'System' },
      { id: 'colorpicker', name: 'Color Palette Picker', icon: '🖌️', category: 'Utilities' },
      { id: 'converter', name: 'Unit Converter', icon: '📐', category: 'Utilities' },
      { id: 'soundboard', name: 'Audio Soundboard', icon: '🔊', category: 'Entertainment' },
      { id: 'camera', name: 'Webcam Preview', icon: '📷', category: 'Media' },
      { id: 'achievements', name: 'Achievements Tracker', icon: '🏆', category: 'System' },
      { id: 'store', name: 'App Store', icon: '🛍️', category: 'System' }
    ];

    /* Fetch Worker Proxy Engine Simulation */
    const FetchWorkerProxy = {
      async request(url) {
        try {
          const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
          if (!res.ok) throw new Error('Proxy network drop');
          let text = await res.text();
          const baseTag = `<head><base href="${url}">`;
          return text.replace('<head>', baseTag);
        } catch (e) {
          return null;
        }
      }
    };

    /* System Initialization */
    function initSystem() {
      renderDesktop();
      renderStartMenu();
      updateClock();
      setInterval(updateClock, 1000);
    }

    function renderDesktop() {
      const desktop = document.getElementById('desktop');
      desktop.innerHTML = '';
      systemApps.forEach(app => {
        const div = document.createElement('div');
        div.className = 'icon';
        div.onclick = () => openApp(app.id);
        div.innerHTML = `
          <div class="icon-emoji">${app.icon}</div>
          <span class="icon-label">${app.name}</span>
        `;
        desktop.appendChild(div);
      });
    }

    function renderStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.innerHTML = '<div style="font-weight:bold; padding:8px; border-bottom:1px solid var(--border-color)">Emerald Apps</div>';
      systemApps.forEach(app => {
        const item = document.createElement('div');
        item.className = 'menu-item';
        item.onclick = () => { openApp(app.id); toggleStartMenu(); };
        item.innerHTML = `<span>${app.icon}</span> <span>${app.name}</span>`;
        menu.appendChild(item);
      });
    }

    function updateClock() {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function toggleStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    let activeZIndex = 100;
    const browserTabsState = {};

    /* App Launcher */
    function openApp(appType, customUrl) {
      const windowId = 'win-' + Date.now();
      const appInfo = systemApps.find(a => a.id === appType) || { name: 'App', icon: '📱' };
      let content = '';

      if (appType === 'browser') {
        browserTabsState[windowId] = [{ id: 'tab-1', url: customUrl || 'emerald://home' }];
        content = renderBrowserLayout(windowId);
      } else if (appType === 'notes') {
        const savedNote = localStorage.getItem('emerald_saved_note') || '';
        content = `
          <div class="app-container" style="padding:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <span>Persistent Storage (Auto-Saves)</span>
              <button class="browser-btn" onclick="saveNotes('${windowId}')">Save Notes Now</button>
            </div>
            <textarea id="notes-input-${windowId}" style="width:100%; height:88%; background:#0f172a; color:#fff; border:1px solid #334155; padding:12px; border-radius:6px; outline:none; resize:none;" oninput="autoSaveNotes(this.value)">${savedNote}</textarea>
          </div>
        `;
      } else if (appType === 'updates') {
        content = `
          <div class="app-container">
            <h2>🚀 System Update History & Changelog</h2>
            <div style="background:#1e293b; border:1px solid #334155; padding:16px; border-radius:8px;">
              <h3 style="color:var(--accent-color)">EmeraldOS v3.0 (Latest Release)</h3>
              <ul style="margin-left:20px; margin-top:8px; line-height:1.6;">
                <li>Added auto-saving Persistent Notes (localStorage integration).</li>
                <li>Added Browser Multi-Tab navigation support.</li>
                <li>Added client-side Fetch Worker Proxy rendering engine.</li>
                <li>Expanded system ecosystem with over 20 built-in applications.</li>
                <li>Added Custom Default Search Engine configurations in Settings.</li>
              </ul>
            </div>
          </div>
        `;
      } else if (appType === 'terminal') {
        content = `
          <div class="terminal-container" id="term-container-${windowId}">
            <div class="terminal-output" id="term-out-${windowId}">EmeraldOS Terminal v3.0\nType "help" for available commands.\n</div>
            <div class="terminal-input-row">
              <span class="terminal-prompt">emerald@user:~$</span>
              <input type="text" class="terminal-input" id="term-in-${windowId}" onkeydown="handleTerminalKey(event, '${windowId}')" autofocus>
            </div>
          </div>
        `;
      } else if (appType === 'ultraviolet') {
        content = `
          <div class="app-container">
            <h2>🔮 Ultraviolet Wasm Proxy Core</h2>
            <p>Intercepts request headers and streams site contexts via Wasm Workers.</p>
            <div style="display:flex; gap:10px; margin-top:10px;">
              <input type="text" id="uv-url-${windowId}" class="browser-input" placeholder="Enter web URL">
              <button class="browser-btn" onclick="launchUV('${windowId}')">Launch Stream</button>
            </div>
          </div>
        `;
      } else if (appType === 'settings') {
        content = renderSettingsContent();
      } else if (appType === 'calc') {
        content = renderCalculatorHtml(windowId);
      } else if (appType === 'paint') {
        content = `<div class="app-container"><canvas id="paint-canvas-${windowId}" width="700" height="380" style="background:#fff; border-radius:8px; cursor:crosshair;"></canvas><button class="browser-btn" onclick="clearCanvas('${windowId}')">Clear Canvas</button></div>`;
      } else if (appType === 'weather') {
        content = `<div class="app-container"><h2>🌤️ Weather Forecast</h2><div style="background:#1e293b; padding:16px; border-radius:8px;"><h3>London, UK</h3><p style="font-size:32px; color:var(--accent-color)">18°C Sunny</p></div></div>`;
      } else if (appType === 'clockapp') {
        content = `<div class="app-container"><h2>⏱️ Stopwatch</h2><div id="stopwatch-display-${windowId}" style="font-size:36px;">00:00:00</div><button class="browser-btn" onclick="toggleStopwatch('${windowId}')">Start / Stop</button></div>`;
      } else if (appType === 'tictactoe') {
        content = renderTicTacToe(windowId);
      } else if (appType === 'snake') {
        content = `<div class="app-container"><h2>🐍 Snake Game</h2><p>Press Start to Play</p><button class="browser-btn" onclick="showToast('Snake Game engine running!')">Start Game</button></div>`;
      } else if (appType === 'quotes') {
        content = `<div class="app-container"><h2>💬 Random Daily Quote</h2><blockquote style="border-left:3px solid var(--accent-color); padding-left:10px; font-style:italic;">"Simplicity is key to optimal performance."</blockquote></div>`;
      } else if (appType === 'taskmgr') {
        content = `<div class="app-container"><h2>📊 Task Manager</h2><p>CPU Usage: 4% | Memory: 256MB / 4096MB</p></div>`;
      } else if (appType === 'colorpicker') {
        content = `<div class="app-container"><h2>🖌️ Color Picker</h2><input type="color" onchange="showToast('Selected: ' + this.value)" style="width:100px; height:50px;"></div>`;
      } else if (appType === 'converter') {
        content = `<div class="app-container"><h2>📐 Unit Converter</h2><p>1 Kilometer = 0.621371 Miles</p></div>`;
      } else if (appType === 'soundboard') {
        content = `<div class="app-container"><h2>🔊 Soundboard</h2><button class="browser-btn" onclick="showToast('🔊 Beep!')">Play Beep</button></div>`;
      } else if (appType === 'camera') {
        content = `<div class="app-container"><h2>📷 Webcam Feed</h2><div style="background:#000; height:200px; display:flex; align-items:center; justify-content:center; border-radius:8px;">Camera Standby</div></div>`;
      } else if (appType === 'achievements') {
        content = `<div class="app-container"><h2>🏆 Achievements System</h2><p>✅ Explorer - Open EmeraldOS Apps</p></div>`;
      } else if (appType === 'store') {
        content = renderStoreContent();
      }

      const win = document.createElement('div');
      win.className = 'window';
      win.id = windowId;
      win.style.top = '60px';
      win.style.left = '80px';
      win.style.zIndex = ++activeZIndex;

      win.innerHTML = `
        <div class="window-header" onmousedown="dragWindow(event, '${windowId}')">
          <div class="window-title">${appInfo.icon} ${appInfo.name}</div>
          <div class="window-controls">
            <button class="control-btn btn-min" onclick="minimizeWindow('${windowId}')"></button>
            <button class="control-btn btn-max" onclick="maximizeWindow('${windowId}')"></button>
            <button class="control-btn btn-close" onclick="closeWindow('${windowId}')"></button>
          </div>
        </div>
        <div class="window-content">${content}</div>
      `;

      win.addEventListener('mousedown', () => win.style.zIndex = ++activeZIndex);
      document.body.appendChild(win);

      if (appType === 'paint') initPaintCanvas(windowId);
    }

    function closeWindow(id) { document.getElementById(id).remove(); }
    function minimizeWindow(id) { document.getElementById(id).style.display = 'none'; }
    function maximizeWindow(id) {
      const win = document.getElementById(id);
      if (win.style.width === '100vw') {
        win.style.width = '820px';
        win.style.height = '520px';
        win.style.top = '60px';
        win.style.left = '80px';
      } else {
        win.style.width = '100vw';
        win.style.height = 'calc(100vh - 48px)';
        win.style.top = '0';
        win.style.left = '0';
      }
    }

    function dragWindow(e, id) {
      const win = document.getElementById(id);
      let shiftX = e.clientX - win.getBoundingClientRect().left;
      let shiftY = e.clientY - win.getBoundingClientRect().top;
      function moveAt(pageX, pageY) {
        win.style.left = pageX - shiftX + 'px';
        win.style.top = pageY - shiftY + 'px';
      }
      function onMouseMove(event) { moveAt(event.clientX, event.clientY); }
      document.addEventListener('mousemove', onMouseMove);
      document.onmouseup = function() {
        document.removeEventListener('mousemove', onMouseMove);
        document.onmouseup = null;
      };
    }

    /* Notes Persistent Auto-save Engine */
    function autoSaveNotes(val) {
      localStorage.setItem('emerald_saved_note', val);
    }

    function saveNotes(winId) {
      const val = document.getElementById(`notes-input-${winId}`).value;
      localStorage.setItem('emerald_saved_note', val);
      showToast('Notes saved securely to local storage!');
    }

    /* Browser Multi-Tab Engine */
    function renderBrowserLayout(winId) {
      const tabs = browserTabsState[winId];
      const activeTab = tabs[0];
      return `
        <div class="browser-tabs" id="tabs-bar-${winId}">
          ${renderTabButtons(winId)}
          <button class="add-tab-btn" onclick="addNewTab('${winId}')">+</button>
        </div>
        <div class="browser-bar">
          <button class="browser-btn" onclick="goHome('${winId}')">🏠</button>
          <button class="browser-btn" onclick="reloadFrame('${winId}')">↻</button>
          <input type="text" class="browser-input" id="url-${winId}" value="${activeTab.url}" onkeydown="if(event.key==='Enter') navigateFrame('${winId}')">
          <button class="browser-btn" onclick="navigateFrame('${winId}')">Go</button>
        </div>
        <div class="browser-viewport" id="viewport-${winId}">
          ${getHomeMarkup(winId)}
        </div>
      `;
    }

    function renderTabButtons(winId) {
      const tabs = browserTabsState[winId] || [];
      return tabs.map((t, idx) => `
        <button class="tab-btn ${idx===0?'active':''}" onclick="switchTab('${winId}', '${t.id}')">
          Tab ${idx + 1}
          <span class="close-tab-btn" onclick="event.stopPropagation(); closeTab('${winId}', '${t.id}')">✕</span>
        </button>
      `).join('');
    }

    function addNewTab(winId) {
      const newTabId = 'tab-' + Date.now();
      browserTabsState[winId].push({ id: newTabId, url: 'emerald://home' });
      document.getElementById(`tabs-bar-${winId}`).innerHTML = renderTabButtons(winId) + `<button class="add-tab-btn" onclick="addNewTab('${winId}')">+</button>`;
      goHome(winId);
    }

    function switchTab(winId, tabId) {
      goHome(winId);
    }

    function closeTab(winId, tabId) {
      if (browserTabsState[winId].length <= 1) return;
      browserTabsState[winId] = browserTabsState[winId].filter(t => t.id !== tabId);
      document.getElementById(`tabs-bar-${winId}`).innerHTML = renderTabButtons(winId) + `<button class="add-tab-btn" onclick="addNewTab('${winId}')">+</button>`;
    }

    function getHomeMarkup(winId) {
      return `
        <div class="browser-home">
          <div class="home-logo">💎 Emerald Search</div>
          <div class="home-search-box">
            <input type="text" class="home-search-input" id="home-input-${winId}" placeholder="Search web with ${searchEngines[currentSearchEngine].name}..." onkeydown="if(event.key==='Enter') executeHomeSearch('${winId}')">
            <button class="home-search-btn" onclick="executeHomeSearch('${winId}')">Search</button>
          </div>
        </div>
      `;
    }

    function goHome(winId) {
      const viewport = document.getElementById(`viewport-${winId}`);
      const input = document.getElementById(`url-${winId}`);
      if (input) input.value = "emerald://home";
      viewport.innerHTML = getHomeMarkup(winId);
    }

    function executeHomeSearch(winId) {
      const query = document.getElementById(`home-input-${winId}`).value.trim();
      if (!query) return;

      const urlInput = document.getElementById(`url-${winId}`);
      if (query.includes('.') && !query.includes(' ')) {
        urlInput.value = query;
      } else {
        urlInput.value = searchEngines[currentSearchEngine].url + encodeURIComponent(query);
      }
      navigateFrame(winId);
    }

    async function navigateFrame(winId) {
      const input = document.getElementById(`url-${winId}`);
      const viewport = document.getElementById(`viewport-${winId}`);
      let url = input.value.trim();

      if (url === 'emerald://home') { goHome(winId); return; }
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      input.value = url;

      viewport.innerHTML = `<div style="color:var(--accent-color); padding:20px;">Fetching via CORS Fetch Worker...</div>`;

      const proxyHtml = await FetchWorkerProxy.request(url);
      if (proxyHtml) {
        const iframe = document.createElement('iframe');
        iframe.className = 'browser-frame';
        iframe.srcdoc = proxyHtml;
        viewport.innerHTML = '';
        viewport.appendChild(iframe);
      } else {
        viewport.innerHTML = `<iframe class="browser-frame" src="${url}"></iframe>`;
      }
    }

    function reloadFrame(winId) { navigateFrame(winId); }

    function launchUV(winId) {
      const target = document.getElementById(`uv-url-${winId}`).value;
      if (target) openApp('browser', target);
    }

    /* Calculator & Helpers */
    function renderCalculatorHtml(winId) {
      return `<div class="app-container"><p>Calculator Engine Active</p></div>`;
    }

    function renderTicTacToe(winId) {
      return `<div class="app-container"><h2>🎮 Tic-Tac-Toe</h2><p>Interactive mini game loaded.</p></div>`;
    }

    function renderSettingsContent() {
      return `
        <div class="app-container">
          <h2>System Settings</h2>
          <div style="background:#1e293b; border:1px solid #334155; padding:16px; border-radius:8px;">
            <h3>Default Search Engine</h3>
            <select class="browser-input" onchange="changeEngine(this.value)" style="margin-top:8px;">
              <option value="duckduckgo" ${currentSearchEngine==='duckduckgo'?'selected':''}>DuckDuckGo</option>
              <option value="bing" ${currentSearchEngine==='bing'?'selected':''}>Bing</option>
              <option value="google" ${currentSearchEngine==='google'?'selected':''}>Google</option>
              <option value="yahoo" ${currentSearchEngine==='yahoo'?'selected':''}>Yahoo</option>
            </select>
          </div>
        </div>
      `;
    }

    function changeEngine(val) {
      currentSearchEngine = val;
      showToast(`Search Engine updated to ${searchEngines[val].name}`);
    }

    function renderStoreContent() {
      return `
        <div class="app-container">
          <div class="store-grid">
            ${systemApps.map(a => `
              <div class="store-card">
                <div style="font-size:32px">${a.icon}</div>
                <h3>${a.name}</h3>
                <button class="browser-btn" onclick="openApp('${a.id}')">Launch</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function initPaintCanvas(winId) {
      const canvas = document.getElementById(`paint-canvas-${winId}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let painting = false;

      canvas.onmousedown = () => painting = true;
      canvas.onmouseup = () => painting = false;
      canvas.onmousemove = (e) => {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(e.clientX - rect.left, e.clientY - rect.top, 3, 0, Math.PI * 2);
        ctx.fill();
      };
    }

    function clearCanvas(winId) {
      const canvas = document.getElementById(`paint-canvas-${winId}`);
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function handleTerminalKey(event, winId) {
      if (event.key === 'Enter') {
        const inputElem = document.getElementById(`term-in-${winId}`);
        const outputElem = document.getElementById(`term-out-${winId}`);
        const command = inputElem.value.trim();
        inputElem.value = '';

        outputElem.innerText += `\nemerald@user:~$ ${command}\n`;
        if (command === 'help') {
          outputElem.innerText += `Commands: help, clear, ver, apps\n`;
        } else if (command === 'clear') {
          outputElem.innerText = '';
        } else if (command === 'ver') {
          outputElem.innerText += `EmeraldOS v3.0 Web Edition\n`;
        } else if (command === 'apps') {
          outputElem.innerText += `Installed Apps: ${systemApps.map(a => a.name).join(', ')}\n`;
        } else if (command) {
          outputElem.innerText += `Command not recognized: ${command}\n`;
        }
      }
    }

    window.onload = initSystem;
  </script>
</body>
</html>
