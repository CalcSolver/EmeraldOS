<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NautilusOS v6.0</title>
  <style>
    /* 10 Preset Themes */
    :root {
      --bg-gradient: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      --accent: #10b981;
      --accent-hover: #059669;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --window-bg: rgba(15, 23, 42, 0.95);
      --text: #f8fafc;
      --border: rgba(16, 185, 129, 0.35);
      --term-text: #38bdf8;
      --cursor-style: auto;
    }

    [data-theme="cyberpunk"] {
      --bg-gradient: radial-gradient(circle at center, #2b0938 0%, #0c0214 100%);
      --accent: #f43f5e;
      --panel-bg: rgba(43, 9, 56, 0.85);
      --window-bg: rgba(24, 9, 38, 0.95);
      --border: rgba(244, 63, 94, 0.35);
      --term-text: #facc15;
    }

    [data-theme="synthwave"] {
      --bg-gradient: linear-gradient(135deg, #18022b 0%, #080014 100%);
      --accent: #d946ef;
      --panel-bg: rgba(24, 2, 43, 0.85);
      --window-bg: rgba(38, 8, 64, 0.95);
      --border: rgba(217, 70, 239, 0.35);
      --term-text: #22d3ee;
    }

    [data-theme="nord"] {
      --bg-gradient: radial-gradient(circle at center, #3b4252 0%, #2e3440 100%);
      --accent: #88c0d0;
      --panel-bg: rgba(46, 52, 64, 0.85);
      --window-bg: rgba(59, 66, 82, 0.95);
      --border: rgba(136, 192, 208, 0.35);
      --term-text: #a3be8c;
    }

    [data-theme="dracula"] {
      --bg-gradient: radial-gradient(circle at center, #282a36 0%, #12131a 100%);
      --accent: #bd93f9;
      --panel-bg: rgba(40, 42, 54, 0.85);
      --window-bg: rgba(68, 71, 90, 0.95);
      --border: rgba(189, 147, 249, 0.35);
      --term-text: #ff79c6;
    }

    [data-theme="sunset"] {
      --bg-gradient: linear-gradient(135deg, #451225 0%, #0f0408 100%);
      --accent: #fb923c;
      --panel-bg: rgba(69, 18, 37, 0.85);
      --window-bg: rgba(41, 15, 26, 0.95);
      --border: rgba(251, 146, 60, 0.35);
      --term-text: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { 
      background: var(--bg-gradient); 
      height: 100vh; 
      overflow: hidden; 
      color: var(--text); 
      transition: background 0.4s ease; 
      cursor: var(--cursor-style);
      position: relative;
    }

    /* Custom Cursor Styles */
    body.cursor-emerald { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%2310b981"><circle cx="12" cy="12" r="8"/></svg>') 12 12, auto; }
    body.cursor-crosshair { cursor: crosshair; }
    body.cursor-pointer { cursor: pointer; }

    /* Background Watermark Nautilus */
    #nautilus-bg-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      height: 550px;
      opacity: 0.05;
      pointer-events: none;
      z-index: 0;
      fill: var(--accent);
      filter: drop-shadow(0 0 20px var(--accent));
      animation: floatPulse 8s ease-in-out infinite alternate;
    }

    @keyframes floatPulse {
      0% { transform: translate(-50%, -50%) scale(0.98); opacity: 0.04; }
      100% { transform: translate(-50%, -50%) scale(1.02); opacity: 0.08; }
    }

    /* Hero Text Animated Banner */
    #hero-banner {
      position: absolute;
      top: 15%;
      width: 100%;
      text-align: center;
      z-index: 1;
      pointer-events: none;
    }

    .animated-subtitle {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 2px;
      color: #94a3b8;
      background: linear-gradient(90deg, rgba(255,255,255,0.4), var(--accent), rgba(255,255,255,0.4));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineText 4s linear infinite, fadeInDown 1.2s ease-out;
      text-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
    }

    @keyframes shineText {
      to { background-position: 200% center; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Auth Screen Overlay */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(16px);
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: var(--window-bg);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 12px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      text-align: center;
    }

    .auth-input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    .auth-btn {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .auth-btn:hover { opacity: 0.9; }
    .auth-btn.secondary { background: #334155; color: #fff; }
    .auth-btn.google { background: #ea4335; color: #fff; }

    /* Desktop Layout */
    #desktop {
      width: 100vw;
      height: calc(100vh - 80px);
      position: relative;
      padding: 20px;
      z-index: 2;
    }

    .icon {
      width: 96px;
      height: 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      position: absolute;
      transition: border 0.2s, background 0.2s;
      border: 1px solid transparent;
    }

    .icon:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--border); }
    body.drag-mode-active .icon { cursor: move; border-color: var(--accent); background: rgba(16, 185, 129, 0.15); box-shadow: 0 0 10px var(--accent); }
    .icon-svg { width: 38px; height: 38px; fill: var(--accent); pointer-events: none; }
    .icon-label { font-size: 11px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8); pointer-events: none; line-height: 1.2; word-break: break-word; }

    /* Floating Capsule Dock Taskbar (Matches Screenshot) */
    #dock-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
    }

    #capsule-dock {
      height: 52px;
      background: rgba(11, 20, 32, 0.85);
      border: 1px solid var(--accent);
      border-radius: 26px;
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 10px rgba(16, 185, 129, 0.1);
    }

    .dock-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .dock-btn:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.1);
    }

    .dock-svg {
      width: 22px;
      height: 22px;
      fill: var(--accent);
    }

    .dock-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.2);
    }

    .dock-clock {
      font-size: 13px;
      color: #f8fafc;
      font-weight: 500;
      margin-left: 4px;
    }

    /* Window UI Frame */
    .window {
      position: absolute;
      width: 820px;
      height: 530px;
      background: var(--window-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 360px;
      min-height: 240px;
      z-index: 10;
    }

    .window-header {
      height: 38px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      cursor: move;
      border-bottom: 1px solid var(--border);
    }

    .window-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .window-controls { display: flex; gap: 8px; }
    .control-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
    .btn-close { background: #ef4444; }
    .btn-min { background: #f59e0b; }
    .btn-max { background: var(--accent); }

    .window-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #080c14; position: relative; }
    .app-container { padding: 18px; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    /* Inputs & UI elements */
    .browser-bar { display: flex; gap: 8px; padding: 10px; background: #111827; border-bottom: 1px solid var(--border); align-items: center; }
    .browser-btn { background: #1f2937; border: 1px solid var(--border); color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
    .browser-btn:hover { background: var(--accent); color: #000; }
    .browser-input { flex: 1; background: #1f2937; border: 1px solid var(--border); color: #fff; padding: 7px 12px; border-radius: 6px; font-size: 13px; outline: none; }

    /* Code Editor & Preview */
    .code-editor { flex: 1; background: #020617; color: var(--term-text); font-family: 'Consolas', monospace; padding: 12px; border: 1px solid var(--border); border-radius: 6px; outline: none; resize: none; font-size: 13px; }
    .preview-frame { flex: 1; background: #ffffff; border: 1px solid var(--border); border-radius: 6px; }

    /* App Store / Grid */
    .category-title { font-size: 13px; font-weight: 700; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 10px; }
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .app-card { background: #1e293b; border: 1px solid var(--border); padding: 14px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; text-align: center; align-items: center; }

    /* Terminal */
    .terminal-container { background: #030712; color: var(--term-text); font-family: 'Consolas', monospace; padding: 14px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .terminal-output { white-space: pre-wrap; line-height: 1.4; }
    .terminal-input-row { display: flex; align-items: center; gap: 8px; }
    .terminal-prompt { color: var(--accent); font-weight: bold; }
    .terminal-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: inherit; }

    /* Start Menu Popup */
    #start-menu { 
      position: absolute; 
      bottom: 80px; 
      left: 50%;
      transform: translateX(-50%); 
      width: 360px; 
      max-height: 480px; 
      overflow-y: auto; 
      background: var(--window-bg); 
      border: 1px solid var(--accent); 
      border-radius: 14px; 
      backdrop-filter: blur(24px); 
      padding: 16px; 
      display: none; 
      flex-direction: column; 
      gap: 6px; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.8); 
      z-index: 1001; 
    }
    .menu-item { padding: 9px 12px; border-radius: 6px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; color: #fff; }
    .menu-item:hover { background: rgba(255, 255, 255, 0.12); color: var(--accent); }

    /* Notifications Toast */
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--accent); color: #000; padding: 12px 20px; border-radius: 8px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }

    .stat-badge {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent);
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- Auth Screen Overlay -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2 style="color: var(--accent);">⚡ NautilusOS Login</h2>
      <p style="font-size: 12px; color: #94a3b8;">Sign in to sync your desktop settings</p>
      
      <input type="email" id="auth-email" class="auth-input" placeholder="Email address">
      <input type="password" id="auth-password" class="auth-input" placeholder="Password">
      
      <button class="auth-btn" id="btn-login-email">Sign In with Email</button>
      <button class="auth-btn secondary" id="btn-signup-email">Create Account</button>
      <button class="auth-btn google" id="btn-login-google">Sign In with Google</button>
      
      <hr style="border-color: var(--border); margin: 4px 0;">
      <button class="auth-btn secondary" id="btn-login-guest">Continue as Guest Mode</button>
    </div>
  </div>

  <!-- Faint Emerald Nautilus Watermark Background -->
  <svg id="nautilus-bg-watermark" viewBox="0 0 512 512">
    <path d="M256,0C114.6,0,0,114.6,0,256s114.6,256,256,256,256-114.6,256-256S397.4,0,256,0Zm0,464C141.1,464,48,370.9,48,256S141.1,48,256,48,464,141.1,464,256,370.9,464,256,464ZM256,96c-88.4,0-160,71.6-160,160s71.6,160,160,160,160-71.6,160-160S344.4,96,256,96Zm0,272c-61.9,0-112-50.1-112-112s50.1-112,112-112,112,50.1,112,112S317.9,368,256,368Zm0-176c-35.3,0-64,28.7-64,64s28.7,64,64,64,64-28.7,64-64S291.3,192,256,192Z"/>
  </svg>

  <!-- Hero Animated Header -->
  <div id="hero-banner">
    <h1 class="animated-subtitle">All apps in one, one account for all apps</h1>
  </div>

  <div id="toast-container"></div>
  <div id="desktop"></div>

  <!-- Windows Style Start Menu Popup -->
  <div id="start-menu"></div>

  <!-- Floating Capsule Dock / Taskbar -->

      <!-- Web Browser -->
      <button class="dock-btn" onclick="openApp('browser')" title="Web Browser">

        <svg class="dock-svg" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
      </button>

      <!-- Clock -->
      <div class="dock-clock" id="dock-clock">8:53 PM</div>

  </div>

  <!-- Firebase Auth Engine -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signInAnonymously, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHalkE8dB7TycHSrBrkZ65fZ_G6aE465c",
      authDomain: "emulator-35ec5.firebaseapp.com",
      projectId: "emulator-35ec5",
      storageBucket: "emulator-35ec5.firebasestorage.app",
      messagingSenderId: "358755516525",
      appId: "1:358755516525:web:d4d141dfb91b5418b4bf64",
      measurementId: "G-HSD9VV55L5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    document.getElementById('btn-login-email').onclick = () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      signInWithEmailAndPassword(auth, email, password).catch(err => alert(err.message));
    };

    document.getElementById('btn-signup-email').onclick = () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      createUserWithEmailAndPassword(auth, email, password).catch(err => alert(err.message));
    };

    document.getElementById('btn-login-google').onclick = () => {
      signInWithPopup(auth, googleProvider).catch(err => alert(err.message));
    };

    document.getElementById('btn-login-guest').onclick = () => {
      signInAnonymously(auth).catch(err => alert(err.message));
    };

    onAuthStateChanged(auth, (user) => {
      const overlay = document.getElementById('auth-overlay');
      if (user) {
        overlay.style.display = 'none';
        showToast(`Welcome ${user.email || 'Guest'}!`);
      } else {
        overlay.style.display = 'flex';
      }
    });
  </script>

  <!-- OS Engine Script -->
  <script>

    function formatFormattedTime(totalSec) {
      const hours = Math.floor(totalSec / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      let res = [];
      if (hours > 0) res.push(`${hours}h`);
      if (minutes > 0 || hours > 0) res.push(`${minutes}m`);
      res.push(`${seconds}s`);
      return res.join(' ');
    }

    setInterval(() => {

      { id: 'notes', name: 'Notes', category: 'Utilities', icon: '<path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>' },
      { id: 'settings', name: 'Settings', category: 'Starter', icon: '<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>' },
      { id: 'achievements', name: 'Achievements', category: 'Games', icon: '<path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2z"/>' }
    ];

    let customApps = JSON.parse(localStorage.getItem('nautilus_custom_apps')) || [];
    let installedApps = JSON.parse(localStorage.getItem('nautilus_installed_apps')) || ['aihandwriting', 'etacollection', 'wallpaper', 'cursor', 'themes', 'browser', 'codeshare', 'creator', 'files', 'terminal', 'store', 'entertainment', 'notes', 'settings', 'achievements'];
    let userProfile = JSON.parse(localStorage.getItem('nautilus_profile')) || { username: 'NautilusUser', theme: 'emerald' };
    let fileSystem = JSON.parse(localStorage.getItem('nautilus_files')) || { 'index.html': '<h1>Welcome to NautilusOS</h1>' };
    let iconPositions = JSON.parse(localStorage.getItem('nautilus_icon_pos')) || {};
    let openWindows = {};
    let activeZIndex = 100;
    let globalDragMode = false;

    function applyTheme(themeName) {
      userProfile.theme = themeName;
      document.body.setAttribute('data-theme', themeName);
      localStorage.setItem('nautilus_profile', JSON.stringify(userProfile));
    }
    applyTheme(userProfile.theme);

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('dock-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    document.getElementById('desktop').addEventListener('click', () => {
      document.getElementById('start-menu').style.display = 'none';
    });

    function toggleGlobalDragMode() {
      globalDragMode = !globalDragMode;
      document.body.classList.toggle('drag-mode-active', globalDragMode);
      showToast(globalDragMode ? 'Icon Dragging: Enabled' : 'Icon Dragging: Locked');
    }

    function renderDesktop() {
      const desktop = document.getElementById('desktop');
      desktop.innerHTML = '';
      let defaultX = 20, defaultY = 20;
      const fullCatalog = [...baseAppsCatalog, ...customApps];

      installedApps.forEach(appId => {
        const app = fullCatalog.find(a => a.id === appId);
        if (!app) return;

        const icon = document.createElement('div');
        icon.className = 'icon';
        icon.id = `icon-${app.id}`;

        const pos = iconPositions[app.id] || { x: defaultX, y: defaultY };
        icon.style.left = `${pos.x}px`;
        icon.style.top = `${pos.y}px`;

        const iconSvg = app.icon.includes('<path') 
          ? `<svg class="icon-svg" viewBox="0 0 24 24">${app.icon}</svg>` 
          : `<div style="font-size:32px;">${app.icon}</div>`;

        icon.innerHTML = `${iconSvg}<span class="icon-label">${app.name}</span>`;
        icon.ondblclick = () => openApp(app.id);
        makeDraggableIcon(icon, app.id);

        desktop.appendChild(icon);

        defaultY += 105;
        if (defaultY > window.innerHeight - 180) {
          defaultY = 20;
          defaultX += 105;
        }
      });

      renderStartMenu();
    }

    function makeDraggableIcon(elem, appId) {
      let posX = 0, posY = 0, mouseX = 0, mouseY = 0;
      elem.onmousedown = (e) => {
        if (!globalDragMode) return;
        e.preventDefault();
        mouseX = e.clientX;
        mouseY = e.clientY;
        document.onmousemove = (e) => {
          posX = mouseX - e.clientX;
          posY = mouseY - e.clientY;
          mouseX = e.clientX;
          mouseY = e.clientY;
          elem.style.top = (elem.offsetTop - posY) + "px";
          elem.style.left = (elem.offsetLeft - posX) + "px";
        };
        document.onmouseup = () => {
          document.onmousemove = null;
          document.onmouseup = null;
          iconPositions[appId] = { x: elem.offsetLeft, y: elem.offsetTop };
          localStorage.setItem('nautilus_icon_pos', JSON.stringify(iconPositions));
        };
      };
    }

    function renderStartMenu() {
      const menu = document.getElementById('start-menu');
      const categories = ['Starter', 'Customization', 'Utilities', 'Developer', 'Games', 'Custom Web Apps'];
      const fullCatalog = [...baseAppsCatalog, ...customApps];
      let html = '<div style="font-size:14px; font-weight:bold; color:var(--accent); margin-bottom:8px;">⚡ Nautilus Launcher</div>';

      categories.forEach(cat => {
        const catApps = fullCatalog.filter(a => a.category === cat && installedApps.includes(a.id));
        if (catApps.length > 0) {
          html += `<div class="category-title">${cat}</div>`;
          catApps.forEach(app => {
            html += `<div class="menu-item" onclick="openApp('${app.id}'); toggleStartMenu();">🚀 ${app.name}</div>`;
          });
        }
      });

      menu.innerHTML = html;
    }

    function setWallpaper(type, value) {
      if (type === 'gradient') {
        document.body.style.background = value;
      } else if (type === 'image') {
        document.body.style.background = `url("${value}") center/cover no-repeat`;
      }
      showToast('Wallpaper Updated!');
    }

    function setCursorStyle(styleClass) {
      document.body.className = styleClass;
      showToast('Cursor Style Changed!');
    }

    /* Window Open Engine */
    function openApp(appId) {
      if (openWindows[appId]) {
        const existingWin = document.getElementById(openWindows[appId]);
        if (existingWin) {
          existingWin.style.display = 'flex';
          existingWin.style.zIndex = ++activeZIndex;
          return;
        }
      }

      const winId = 'win-' + Date.now();
      openWindows[appId] = winId;
      const fullCatalog = [...baseAppsCatalog, ...customApps];
      const appObj = fullCatalog.find(a => a.id === appId);
      let title = appObj ? appObj.name : 'Application';
      let content = '';

      if (appId === 'wallpaper') {
        content = `
          <div class="app-container">
            <h2>🎨 Wallpaper Customization</h2>
            <div style="display:flex; flex-direction:column; gap:12px;">
              <button class="browser-btn" onclick="setWallpaper('gradient', 'radial-gradient(circle at center, #0f172a 0%, #020617 100%)')">Deep Emerald Void</button>
              <button class="browser-btn" onclick="setWallpaper('gradient', 'linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%)')">Cosmic Purple</button>
              <button class="browser-btn" onclick="setWallpaper('gradient', 'radial-gradient(circle, #18181b 0%, #09090b 100%)')">Pure Dark Slate</button>
              <hr style="border-color:var(--border);">
              <label>Custom Wallpaper Image URL:</label>
              <div style="display:flex; gap:8px;">
                <input type="text" id="wall-url" class="browser-input" placeholder="https://images.unsplash.com/photo...">
                <button class="browser-btn" onclick="setWallpaper('image', document.getElementById('wall-url').value)">Apply</button>
              </div>
            </div>
          </div>
        `;

      } else if (appId === 'cursor') {
        content = `
          <div class="app-container">
            <h2>🖱️ Custom Cursors</h2>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <button class="browser-btn" onclick="setCursorStyle('')">Default System Cursor</button>
              <button class="browser-btn" onclick="setCursorStyle('cursor-emerald')">Emerald Dot Cursor</button>
              <button class="browser-btn" onclick="setCursorStyle('cursor-crosshair')">Precision Crosshair</button>
              <button class="browser-btn" onclick="setCursorStyle('cursor-pointer')">Hand Pointer Cursor</button>
            </div>
          </div>
        `;

      } else if (appId === 'themes') {
        const themes = ['emerald', 'cyberpunk', 'synthwave', 'nord', 'dracula', 'sunset'];
        content = `
          <div class="app-container">
            <h2>🎨 Color Themes</h2>
            <div class="app-grid">
              ${themes.map(t => `<button class="browser-btn" onclick="applyTheme('${t}')">${t.toUpperCase()}</button>`).join('')}
            </div>
          </div>
        `;

      } else if (appId === 'etacollection') {
        content = `
          <div class="app-container">
            <h2>📦 The ETA Collection</h2>
            <p style="color:#94a3b8; font-size:13px;">Instant access to all integrated apps and custom frame portals:</p>
            <div class="app-grid" style="margin-top:10px;">
              <div class="app-card">
                <h3>✍️ AI HANDWRITING</h3>
                <button class="browser-btn" onclick="openApp('aihandwriting')">Launch App</button>
              </div>
              <div class="app-card">
                <h3>💻 Code Share</h3>
                <button class="browser-btn" onclick="openApp('codeshare')">Launch App</button>
              </div>
              <div class="app-card">
                <h3>🎮 Games Center</h3>
                <button class="browser-btn" onclick="openApp('entertainment')">Launch App</button>
              </div>
            </div>
          </div>
        `;

      } else if (appId === 'aihandwriting') {
        content = `<iframe src="https://secret-lemon-five.vercel.app/" style="width:100%; height:100%; border:none;"></iframe>`;

      } else if (appId === 'codeshare') {
        content = `<iframe src="https://codeshare-eta.vercel.app/" style="width:100%; height:100%; border:none;"></iframe>`;

      } else if (appId === 'browser') {
        content = `
          <div class="browser-bar">
            <input type="text" class="browser-input" placeholder="Search Bing or enter URL..." id="url-${winId}" onkeydown="if(event.key==='Enter') executeSearch('${winId}')">
            <button class="browser-btn" onclick="executeSearch('${winId}')">Go</button>
          </div>
          <div class="window-content" id="view-${winId}">
            <iframe id="frame-${winId}" style="width:100%; height:100%; border:none;" src="https://www.bing.com"></iframe>
          </div>
        `;

      } else if (appId === 'files') {
        content = `
          <div class="app-container">
            <h2>File Explorer</h2>
            <div style="display:flex; gap:12px; height:80%;">
              <div style="width:30%; background:#1e293b; border:1px solid var(--border); border-radius:6px; padding:10px;">
                📄 index.html
              </div>
              <textarea class="code-editor" style="flex:1;">${fileSystem['index.html']}</textarea>
            </div>
          </div>
        `;

      } else if (appId === 'terminal') {
        content = `
          <div class="terminal-container">
            <div class="terminal-output">NautilusOS Terminal v6.0\nType 'help' for commands.\n</div>
            <div class="terminal-input-row">
              <span class="terminal-prompt">user@nautilusos:~$</span>
              <input type="text" class="terminal-input" autofocus>
            </div>
          </div>
        `;

      } else if (appObj && appObj.url) {
        content = `<iframe src="${appObj.url}" style="width:100%; height:100%; border:none;"></iframe>`;
      } else {
        content = `<div class="app-container"><h2>${title}</h2><p>Application active.</p></div>`;
      }

      const win = document.createElement('div');
      win.className = 'window';
      win.id = winId;
      win.style.top = `${60 + (Object.keys(openWindows).length * 15)}px`;
      win.style.left = `${80 + (Object.keys(openWindows).length * 15)}px`;
      win.style.zIndex = ++activeZIndex;

      win.innerHTML = `
        <div class="window-header" onmousedown="dragWindow(event, '${winId}')">
          <div class="window-title">⚡ ${title}</div>
          <div class="window-controls">
            <button class="control-btn btn-min" onclick="document.getElementById('${winId}').style.display='none'"></button>
            <button class="control-btn btn-max" onclick="maximizeWindow('${winId}')"></button>
            <button class="control-btn btn-close" onclick="closeWindow('${appId}', '${winId}')"></button>
          </div>
        </div>
        <div class="window-content">${content}</div>
      `;

      win.onmousedown = () => { win.style.zIndex = ++activeZIndex; };
      document.body.appendChild(win);
    }

    function closeWindow(appId, winId) {
      document.getElementById(winId).remove();
      delete openWindows[appId];
    }

    function executeSearch(winId) {
      const input = document.getElementById(`url-${winId}`).value.trim();
      const iframe = document.getElementById(`frame-${winId}`);
      if (!input) return;
      iframe.src = input.startsWith('http') ? input : `https://www.bing.com/search?q=${encodeURIComponent(input)}`;
    }

    function dragWindow(e, id) {
      const win = document.getElementById(id);
      let shiftX = e.clientX - win.getBoundingClientRect().left;
      let shiftY = e.clientY - win.getBoundingClientRect().top;
      document.onmousemove = (e) => {
        win.style.left = (e.clientX - shiftX) + 'px';
        win.style.top = (e.clientY - shiftY) + 'px';
      };
      document.onmouseup = () => document.onmousemove = null;
    }

    function maximizeWindow(id) {
      const win = document.getElementById(id);
      if (win.style.width === '100vw') {
        win.style.width = '820px';
        win.style.height = '530px';
      } else {
        win.style.width = '100vw';
        win.style.height = 'calc(100vh - 80px)';
        win.style.top = '0';
        win.style.left = '0';
      }
    }

    renderDesktop();
  </script>
