<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emerald OS</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #062016 0%, #020617 100%);
      --accent: #10b981;
      --accent-hover: #059669;
      --panel-bg: #0d1520;
      --window-bg: rgba(11, 20, 32, 0.96);
      --card-bg: rgba(15, 23, 42, 0.7);
      --text: #f8fafc;
      --border: rgba(16, 185, 129, 0.35);
      --term-text: #34d399;
    }

    body.theme-cyber {
      --bg-gradient: radial-gradient(circle at center, #2e1065 0%, #090514 100%);
      --accent: #06b6d4;
      --border: rgba(6, 182, 212, 0.4);
    }
    body.theme-midnight {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      --accent: #6366f1;
      --border: rgba(99, 102, 241, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body { 
      background: var(--bg-gradient); 
      background-size: cover;
      background-position: center;
      height: 100vh; 
      overflow: hidden; 
      color: var(--text); 
      position: relative;
    }

    #fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    /* Boot Screen */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: #020617;
      z-index: 50000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      animation: fadeOutBoot 0.6s ease 1.8s forwards;
    }
    .boot-logo { width: 80px; height: 80px; fill: var(--accent); filter: drop-shadow(0 0 20px var(--accent)); }
    .boot-text { font-size: 18px; letter-spacing: 2px; color: #e2e8f0; }
    @keyframes fadeOutBoot { to { opacity: 0; visibility: hidden; pointer-events: none; } }

    /* Desktop Layout */
    #desktop {
      width: 100vw;
      height: calc(100vh - 80px);
      position: relative;
      padding: 20px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 15px;
      overflow-x: auto;
    }

    .desktop-icon {
      width: 90px;
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: all 0.2s;
      border: 1px solid transparent;
      background: rgba(0,0,0,0.25);
    }
    .desktop-icon:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--border); transform: scale(1.05); }
    .icon-svg { width: 34px; height: 34px; fill: var(--accent); pointer-events: none; }
    .icon-label { font-size: 11px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.9); pointer-events: none; word-break: break-word; }

    /* Floating Quick Bar */
    #js-menu-bar {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #0d1520;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 9000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      cursor: move;
      backdrop-filter: blur(10px);
    }
    .js-menu-title { font-size: 12px; font-weight: bold; color: var(--accent); }
    .js-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }
    .js-btn:hover { background: var(--accent); color: #000; }

    /* Start Launcher Overlay */
    #start-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 20000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px);
    }
    #start-launcher {
      width: 760px; max-height: 85vh; background: #0d1520; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 25px 60px rgba(0,0,0,0.8); display: flex; flex-direction: column; padding: 24px; gap: 20px;
    }
    .launcher-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; overflow-y: auto; max-height: 420px; }
    .launcher-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 18px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
    .launcher-card:hover { background: rgba(16, 185, 129, 0.1); border-color: var(--accent); }

    /* Taskbar Dock */
    #dock-container { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10000; }
    #capsule-dock { height: 56px; background: #09111e; border: 1px solid var(--border); border-radius: 28px; backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 18px; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .dock-title { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; padding-right: 6px; }
    
    .dock-btn { 
      background: transparent; 
      border: none; 
      color: var(--accent); 
      cursor: pointer; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      padding: 6px 8px; 
      border-radius: 12px; 
      position: relative;
    }
    .dock-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .dock-svg { width: 22px; height: 22px; fill: var(--accent); }
    .dock-divider { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.15); margin: 0 4px; }
    .dock-clock { font-size: 13px; color: #f8fafc; font-weight: 500; }

    /* Active Line Indicator Under App */
    .dock-btn::after {
      content: '';
      position: absolute;
      bottom: 2px;
      width: 0px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--accent);
      transition: width 0.3s ease;
    }
    .dock-btn.active::after {
      width: 16px;
    }

    /* Windows */
    .window {
      position: absolute; width: 820px; height: 550px; max-width: 95vw; max-height: 85vh; background: var(--window-bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8); backdrop-filter: blur(16px); display: flex; flex-direction: column; overflow: hidden; z-index: 10;
    }
    .window-header { height: 38px; background: rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; cursor: move; border-bottom: 1px solid var(--border); }
    .window-title { font-size: 13px; font-weight: 600; }
    .window-controls { display: flex; gap: 8px; }
    .control-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
    .btn-close { background: #ef4444; }
    .btn-min { background: #f59e0b; }
    .btn-max { background: var(--accent); }

    .window-content { flex: 1; display: flex; flex-direction: column; overflow: auto; background: #080c14; position: relative; }
    .app-container { padding: 20px; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    .browser-btn { background: #1f2937; border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .browser-btn:hover { background: var(--accent); color: #000; }
    .browser-input { background: #1f2937; border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }

    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .app-card { background: #1e293b; border: 1px solid var(--border); padding: 16px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; text-align: center; align-items: center; justify-content: space-between; }

    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: var(--accent); color: #000; padding: 12px 20px; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <div id="boot-screen">
    <svg class="boot-logo" viewBox="0 0 512 512"><path d="M256,0C114.6,0,0,114.6,0,256s114.6,256,256,256,256-114.6,256-256S397.4,0,256,0Zm0,464C141.1,464,48,370.9,48,256S141.1,48,256,48,464,141.1,464,256,370.9,464,256,464Z"/></svg>
    <div class="boot-text">Loading Emerald OS...</div>
  </div>

  <div id="js-menu-bar" onmousedown="dragJSMenu(event)">
    <span class="js-menu-title">⚡ Quick Menu</span>
    <button class="js-btn" onclick="openApp('emeraldworld')">Emerald World 3D</button>
    <button class="js-btn" onclick="openApp('store')">App Store</button>
    <button class="js-btn" onclick="triggerMatrixEffect()">Matrix</button>
    <button class="js-btn" onclick="openApp('settings')">Settings</button>
  </div>

  <div id="desktop"></div>

  <div id="start-modal-overlay" onclick="closeLauncher(event)">
    <div id="start-launcher" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Emerald OS User</h3>
        <button class="browser-btn" onclick="showToast('Session Online')">Status: Active</button>
      </div>
      <input type="text" id="launcher-search" class="browser-input" placeholder="Search installed apps..." oninput="filterLauncherApps()">
      <div class="launcher-grid" id="launcher-grid"></div>
    </div>
  </div>

  <!-- Dock with Emerald OS Title & App Indicators -->
  <div id="dock-container">
    <div id="capsule-dock">
      <span class="dock-title">Emerald OS</span>
      <div class="dock-divider"></div>
      <button class="dock-btn" onclick="toggleLauncherModal()"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg></button>
      <div class="dock-divider"></div>
      <button class="dock-btn" id="dock-btn-emeraldworld" onclick="openApp('emeraldworld')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9L2 6v11l10 5 10-5V6l-10 5z"/></svg></button>
      <button class="dock-btn" id="dock-btn-store" onclick="openApp('store')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg></button>
      <button class="dock-btn" id="dock-btn-explorer" onclick="openApp('explorer')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></button>
      <button class="dock-btn" id="dock-btn-photos" onclick="openApp('photos')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2z"/></svg></button>
      <button class="dock-btn" id="dock-btn-tasks" onclick="openApp('tasks')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></button>
      <button class="dock-btn" id="dock-btn-sysmon" onclick="openApp('sysmon')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.09-4-4L2 15.66z"/></svg></button>
      <button class="dock-btn" id="dock-btn-settings" onclick="openApp('settings')"><svg class="dock-svg" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58z"/></svg></button>
      <div class="dock-divider"></div>
      <div class="dock-clock" id="dock-clock">12:00 PM</div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    const baseAppsCatalog = [
      { id: 'emeraldworld', name: 'Emerald World 3D', cat: 'Media', desc: 'Interactive 3D Perspective Matrix Grid & App Navigator', icon: '<path d="M12 2L2 7l10 5 10-5-10-5zm0 9L2 6v11l10 5 10-5V6l-10 5z"/>' },
      { id: 'store', name: 'App Store', cat: 'System', desc: 'Browse, install, and update Emerald OS apps', icon: '<path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/>' },
      { id: 'explorer', name: 'File Explorer', cat: 'System', desc: 'Manage virtual file system and system directories', icon: '<path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>' },
      { id: 'tasks', name: 'Task Board', cat: 'Productivity', desc: 'Track your personal goals and system tasks', icon: '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>' },
      { id: 'sysmon', name: 'System Monitor', cat: 'System', desc: 'Real-time CPU, RAM, and system resource performance', icon: '<path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.09-4-4L2 15.66z"/>' },
      { id: 'terminal', name: 'Terminal', cat: 'Utilities', desc: 'Emerald Shell CLI tool environment', icon: '<path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.11-.9-2-2-2z"/>' },
      { id: 'codepad', name: 'JS CodePad', cat: 'Developer', desc: 'JavaScript Code Editor and live Console execution sandbox', icon: '<path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>' },
      { id: 'paint', name: 'Paint Lab', cat: 'Graphics', desc: 'Digital drawing and canvas suite', icon: '<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61.43.54 1.03.89 1.7.89h1.83c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.37-.61-.37-1 0-.83.67-1.5 1.5-1.5H15c2.76 0 5-2.24 5-5 0-4.42-3.58-8-8-8z"/>' },
      { id: 'photos', name: 'Photos', cat: 'Media', desc: 'View local images and configure custom wallpapers', icon: '<path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2z"/>' },
      { id: 'snake', name: 'Retro Snake', cat: 'Gaming', desc: 'Classic arcade snake game built for Emerald OS', icon: '<path d="M7 18h2V6H7v12zm4 0h2V6h-2v12zm4 0h2V6h-2v12z"/>' },
      { id: 'tictactoe', name: 'TicTacToe', cat: 'Gaming', desc: 'Play TicTacToe against the Emerald AI', icon: '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>' },
      { id: 'calculator', name: 'Calculator', cat: 'Utilities', desc: 'Standard mathematical calculator', icon: '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>' },
      { id: 'settings', name: 'Settings', cat: 'System', desc: 'Configure OS themes, options, and system reset', icon: '<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58z"/>' }
    ];

    let installedApps = ['emeraldworld', 'store', 'explorer', 'tasks', 'sysmon', 'terminal', 'codepad', 'paint', 'photos', 'snake', 'tictactoe', 'calculator', 'settings'];
    let openWindows = {};
    let activeZIndex = 100;
    let taskList = [{ text: 'Explore Emerald World 3D Workspace', done: true }, { text: 'Test Nautilus built-in File Explorer', done: false }];

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    function updateClock() {
      document.getElementById('dock-clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateDockIndicators() {
      document.querySelectorAll('.dock-btn').forEach(btn => btn.classList.remove('active'));
      Object.keys(openWindows).forEach(appId => {
        const btn = document.getElementById(`dock-btn-${appId}`);
        if (btn) btn.classList.add('active');
      });
    }

    function toggleLauncherModal() {
      const overlay = document.getElementById('start-modal-overlay');
      overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
      if (overlay.style.display === 'flex') renderLauncherGrid();
    }

    function closeLauncher() { document.getElementById('start-modal-overlay').style.display = 'none'; }

    function renderLauncherGrid(filter = '') {
      const grid = document.getElementById('launcher-grid');
      grid.innerHTML = '';
      baseAppsCatalog.filter(app => installedApps.includes(app.id) && app.name.toLowerCase().includes(filter.toLowerCase())).forEach(app => {
        const card = document.createElement('div');
        card.className = 'launcher-card';
        card.onclick = () => { openApp(app.id); closeLauncher(); };
        card.innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24">${app.icon}</svg><span>${app.name}</span>`;
        grid.appendChild(card);
      });
    }

    function filterLauncherApps() { renderLauncherGrid(document.getElementById('launcher-search').value); }

    function renderDesktop() {
      const desktop = document.getElementById('desktop');
      desktop.innerHTML = '';
      installedApps.forEach(appId => {
        const app = baseAppsCatalog.find(a => a.id === appId);
        if (!app) return;
        const icon = document.createElement('div');
        icon.className = 'desktop-icon';
        icon.ondblclick = () => openApp(app.id);
        icon.innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24">${app.icon}</svg><span class="icon-label">${app.name}</span>`;
        desktop.appendChild(icon);
      });
    }

    function dragJSMenu(e) {
      const bar = document.getElementById('js-menu-bar');
      let shiftX = e.clientX - bar.getBoundingClientRect().left;
      let shiftY = e.clientY - bar.getBoundingClientRect().top;
      document.onmousemove = (e) => {
        bar.style.left = (e.clientX - shiftX) + 'px';
        bar.style.top = (e.clientY - shiftY) + 'px';
        bar.style.right = 'auto';
      };
      document.onmouseup = () => document.onmousemove = null;
    }

    /* Master Window Engine */
    function openApp(appId) {
      if (openWindows[appId]) {
        const existing = document.getElementById(openWindows[appId]);
        if (existing) { existing.style.display = 'flex'; existing.style.zIndex = ++activeZIndex; return; }
      }

      const winId = 'win-' + Date.now();
      openWindows[appId] = winId;
      updateDockIndicators();

      const appObj = baseAppsCatalog.find(a => a.id === appId) || { name: 'App' };
      let content = '';

      if (appId === 'emeraldworld') {
        content = `
          <div style="width:100%; height:100%; position:relative; overflow:hidden;" id="ew-container-${winId}">
            <canvas id="ew-canvas-${winId}" style="width:100%; height:100%; display:block; background:#020617; cursor:pointer;"></canvas>
            <div style="position:absolute; top:20px; left:20px; background:rgba(2,6,23,0.85); padding:12px 16px; border-radius:8px; border:1px solid var(--accent); max-width:340px; pointer-events:none;">
              <h3 style="color:var(--accent);">Emerald World 3D Workspace</h3>

    function maximizeWindow(id) { const win = document.getElementById(id); win.style.width = win.style.width === '100vw' ? '820px' : '100vw'; win.style.height = win.style.height === 'calc(100vh - 80px)' ? '550px' : 'calc(100vh - 80px)'; }
    function dragWindow(e, id) { const win = document.getElementById(id); let shiftX = e.clientX - win.getBoundingClientRect().left; let shiftY = e.clientY - win.getBoundingClientRect().top; document.onmousemove = (e) => { win.style.left = (e.clientX - shiftX) + 'px'; win.style.top = (e.clientY - shiftY) + 'px'; }; document.onmouseup = () => document.onmousemove = null; }

    /* Interactive 3D World App Engine */
    function initEmeraldWorld3D(winId) {
      setTimeout(() => {
        const canvas = document.getElementById(`ew-canvas-${winId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        const resizeCanvas = () => {
          if (canvas.parentElement) {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
          }
        };
        resizeCanvas();

        let zOffset = 0;
        let speed = 1.5;
        let renderedAppNodes = [];

        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          zOffset += e.deltaY * 0.8;
        });

        canvas.addEventListener('click', (e) => {
          const rect = canvas.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;

          renderedAppNodes.forEach(node => {
            if (mx >= node.x - 35 && mx <= node.x + 35 && my >= node.y - 35 && my <= node.y + 35) {
              openApp(node.id);
            }
          });
        });

        function render() {
          if (!document.getElementById(`ew-canvas-${winId}`)) return;

          ctx.fillStyle = 'rgba(2, 6, 23, 0.3)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          zOffset += speed;
          renderedAppNodes = [];

          // Grid Tunnel Perspective
          for (let z = 100; z < 1200; z += 60) {
            let actualZ = (z - (zOffset % 60));
            if (actualZ <= 0) continue;
            
            let k = 350 / actualZ;
            let size = 1800 * k;
            
            ctx.strokeStyle = `rgba(16, 185, 129, ${Math.max(0, 1 - actualZ / 1200)})`;
            ctx.lineWidth = 1;
            ctx.strokeRect(cx - size / 2, cy - size / 2, size, size);
          }

          // Render Floating 3D Apps inside canvas space
          baseAppsCatalog.forEach((app, idx) => {
            if (!installedApps.includes(app.id)) return;

            let angle = idx * 0.8;
            let radius = 250;
            let x = Math.sin(angle) * radius;
            let y = Math.cos(angle) * (radius * 0.6);
            let z = ((idx * 120) - zOffset) % 1000;
            if (z <= 50) z += 1000;

            let k = 350 / z;
            let px = x * k + cx;
            let py = y * k + cy;
            let scale = Math.max(0.4, k * 1.5);

            if (px > 50 && px < canvas.width - 50 && py > 50 && py < canvas.height - 50) {
              renderedAppNodes.push({ id: app.id, x: px, y: py });

              ctx.save();
              ctx.translate(px, py);
              ctx.scale(scale, scale);

              ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
              ctx.strokeStyle = '#10b981';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(0, 0, 30, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();

              ctx.fillStyle = '#10b981';
              ctx.font = 'bold 12px Segoe UI';
              ctx.textAlign = 'center';
              ctx.fillText(app.name, 0, 48);

              ctx.restore();
            }
          });

          requestAnimationFrame(render);
        }
        render();
      }, 100);
    }

      const timer = setInterval(() => {

    /* Retro Snake Game Engine */
    function initSnakeGame(winId) {
      setTimeout(() => {
        const canvas = document.getElementById(`snake-canvas-${winId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 1, dy = 0;

        document.onkeydown = (e) => {
          if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
          if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
          if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
          if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
        };

        const gameInterval = setInterval(() => {
          if (!document.getElementById(`snake-canvas-${winId}`)) { clearInterval(gameInterval); return; }
          const head = {x: snake[0].x + dx, y: snake[0].y + dy};
          if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) { clearInterval(gameInterval); showToast('Game Over!'); return; }
          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            food = {x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20)};
          } else {
            snake.pop();
          }

          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, 320, 320);
          ctx.fillStyle = '#10b981';
          snake.forEach(p => ctx.fillRect(p.x * 16, p.y * 16, 14, 14));
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(food.x * 16, food.y * 16, 14, 14);
        }, 120);
      }, 100);
    }

    /* Paint Engine */
    function initPaint(winId) {
      setTimeout(() => {
        const canvas = document.getElementById(`paint-canvas-${winId}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let drawing = false;
        canvas.onmousedown = () => drawing = true;
        canvas.onmouseup = () => { drawing = false; ctx.beginPath(); };
        canvas.onmousemove = (e) => {
          if (!drawing) return;
          const rect = canvas.getBoundingClientRect();
          ctx.lineWidth = 4; ctx.lineCap = 'round';
          ctx.strokeStyle = document.getElementById(`paint-color-${winId}`).value;
          ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
          ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        };
      }, 100);
    }
    function clearCanvas(winId) { const canvas = document.getElementById(`paint-canvas-${winId}`); canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); }

    /* TicTacToe Engine */
    let tttBoard = Array(9).fill('');
    function resetTTT(winId) {
      tttBoard = Array(9).fill('');
      const board = document.getElementById(`ttt-board-${winId}`);
      if (!board) return;
      board.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const btn = document.createElement('button');
        btn.className = 'browser-btn';
        btn.style.height = '60px'; btn.style.fontSize = '20px';
        btn.onclick = () => makeTTTMove(i, winId);
        board.appendChild(btn);
      }
    }
    function makeTTTMove(i, winId) {
      if (tttBoard[i]) return;
      tttBoard[i] = 'X';
      updateTTTBoard(winId);
      if (!checkTTTWin()) {
        let empty = tttBoard.map((v, idx) => v === '' ? idx : null).filter(v => v !== null);
        if (empty.length > 0) {
          let aiChoice = empty[Math.floor(Math.random() * empty.length)];
          tttBoard[aiChoice] = 'O';
          updateTTTBoard(winId);
        }
      }
    }
    function updateTTTBoard(winId) {
      const board = document.getElementById(`ttt-board-${winId}`);
      if (!board) return;
      Array.from(board.children).forEach((btn, idx) => {
        btn.innerText = tttBoard[idx];
      });
    }
    function checkTTTWin() {
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for (let w of wins) {
        if (tttBoard[w[0]] && tttBoard[w[0]] === tttBoard[w[1]] && tttBoard[w[0]] === tttBoard[w[2]]) {
          showToast(`${tttBoard[w[0]]} Wins!`); return true;
        }
      }
      return false;
    }

    /* Calculator Helpers */
    function calcNum(winId, val) { const d = document.getElementById(`calc-disp-${winId}`); if (d.value === '0') d.value = ''; d.value += val; }
    function calcEval(winId) { const d = document.getElementById(`calc-disp-${winId}`); try { d.value = eval(d.value); } catch(e) { d.value = 'Error'; } }

    /* Terminal Command Runner */
    function runTermCmd(winId) {
      const inp = document.getElementById(`term-in-${winId}`);
      const out = document.getElementById(`term-out-${winId}`);
      const cmd = inp.value.trim().toLowerCase();
      out.innerHTML += `<br>$ ${inp.value}`;
      if (cmd === 'help') out.innerHTML += '<br>Commands: help, ls, clear, date, matrix';
      else if (cmd === 'ls') out.innerHTML += '<br>emerald_world.3d system_settings.sys photos.lib';
      else if (cmd === 'clear') { out.innerHTML = ''; }
      else if (cmd === 'date') { out.innerHTML += `<br>${new Date().toString()}`; }
      else if (cmd === 'matrix') { triggerMatrixEffect(); out.innerHTML += '<br>Matrix visualizer triggered.'; }
      else { out.innerHTML += `<br>Command not recognized: '${cmd}'`; }
      inp.value = '';
      out.scrollTop = out.scrollHeight;
    }

    /* CodePad Sandbox Runner */
    function runPadCode(winId) {
      const code = document.getElementById(`code-in-${winId}`).value;
      const out = document.getElementById(`code-out-${winId}`);
      try {
        let logs = [];
        const originalLog = console.log;
        console.log = (...args) => logs.push(args.join(' '));
        eval(code);
        console.log = originalLog;
        out.innerText = logs.join('\n') || 'Executed successfully with no log output.';
      } catch (err) {
        out.innerText = 'Error: ' + err.message;
      }
    }

    /* Matrix Screen Visualizer Effect */
    function triggerMatrixEffect() {
      showToast('Matrix Overlay Activated!');
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const chars = '0123456789ABCDEF';
      const fontSize = 14;
      const columns = Math.floor(canvas.width / fontSize);
      const drops = Array(columns).fill(1);

      function drawMatrix() {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#10b981';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
      }
      setInterval(drawMatrix, 33);
    }

    // Initialize Desktop View
    renderDesktop();
  </script>
</body>
</html>
