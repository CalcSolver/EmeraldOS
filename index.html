<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NautilusOS v9.0 Ultimate</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #062016 0%, #020617 100%);
      --accent: #10b981;
      --accent-hover: #059669;
      --panel-bg: #0d1520;
      --window-bg: rgba(11, 20, 32, 0.96);
      --card-bg: rgba(15, 23, 42, 0.7);
      --text: #f8fafc;
      --border: rgba(16, 185, 129, 0.35);
      --term-text: #34d399;
      --cursor-style: auto;
    }

    /* System Themes */
    body.theme-cyber {
      --bg-gradient: radial-gradient(circle at center, #2e1065 0%, #090514 100%);
      --accent: #06b6d4;
      --border: rgba(6, 182, 212, 0.4);
      --term-text: #22d3ee;
    }
    body.theme-midnight {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      --accent: #6366f1;
      --border: rgba(99, 102, 241, 0.4);
      --term-text: #818cf8;
    }
    body.theme-sunset {
      --bg-gradient: radial-gradient(circle at center, #451a03 0%, #020617 100%);
      --accent: #f97316;
      --border: rgba(249, 115, 22, 0.4);
      --term-text: #fb923c;
    }
    body.custom-cursor { cursor: crosshair !important; }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body { 
      background: var(--bg-gradient); 
      background-size: cover;
      background-position: center;
      height: 100vh; 
      overflow: hidden; 
      color: var(--text); 
      position: relative;
      transition: background 0.4s ease;
    }

    /* Canvas Overlays for Cool Things */
    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Boot Screen Animation */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: #020617;
      z-index: 50000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      animation: fadeOutBoot 0.8s ease 3.2s forwards;
    }

    .boot-logo {
      width: 100px;
      height: 100px;
      fill: var(--accent);
      filter: drop-shadow(0 0 25px var(--accent));
      animation: pulseNautilus 2s ease-in-out infinite alternate, spinIntro 1.2s ease-out;
    }

    .boot-text {
      font-size: 20px;
      letter-spacing: 2px;
      color: #e2e8f0;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid var(--accent);
      width: 0;
      animation: typingText 2.2s steps(40, end) 0.5s forwards, blinkCursor 0.75s step-end infinite;
    }

    @keyframes spinIntro { from { transform: scale(0) rotate(-180deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes pulseNautilus { from { transform: scale(0.95); } to { transform: scale(1.05); } }
    @keyframes typingText { from { width: 0; } to { width: 420px; } }
    @keyframes blinkCursor { from, to { border-color: transparent; } 50% { border-color: var(--accent); } }
    @keyframes fadeOutBoot { to { opacity: 0; visibility: hidden; pointer-events: none; } }

    /* Desktop Grid Area */
    #desktop {
      width: 100vw;
      height: calc(100vh - 80px);
      position: relative;
      padding: 20px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 15px;
      overflow-x: auto;
    }

    .desktop-icon {
      width: 90px;
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: all 0.2s;
      border: 1px solid transparent;
      background: rgba(0,0,0,0.15);
    }

    .desktop-icon:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--border); transform: scale(1.05); }
    .icon-svg { width: 34px; height: 34px; fill: var(--accent); pointer-events: none; }
    .icon-label { font-size: 11px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.9); pointer-events: none; word-break: break-word; line-height: 1.2; }

    /* Draggable JavaScript Floating Toolbar */
    #js-menu-bar {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #0d1520;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 9000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      cursor: move;
      backdrop-filter: blur(10px);
    }

    .js-menu-title { font-size: 12px; font-weight: bold; color: var(--accent); white-space: nowrap; }
    .js-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }
    .js-btn:hover { background: var(--accent); color: #000; }

    /* Background Watermark */
    #nautilus-bg-watermark {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 580px; height: 580px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
      fill: var(--accent);
    }

    /* Start Launcher Overlay Window */
    #start-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }

    #start-launcher {
      width: 760px;
      max-height: 85vh;
      background: #0d1520;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
      overflow: hidden;
    }

    .launcher-user-bar { display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #000; }
    .user-details h3 { font-size: 16px; font-weight: 700; color: #fff; }
    .user-details span { font-size: 12px; color: #94a3b8; }
    .launcher-actions { display: flex; gap: 10px; }
    .action-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .action-btn:hover { background: rgba(255,255,255,0.12); }
    .action-btn.shutdown { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }

    .launcher-search-box { position: relative; display: flex; align-items: center; }
    .launcher-search-input { width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-radius: 10px; padding: 12px 42px 12px 16px; color: #fff; font-size: 14px; outline: none; }
    .launcher-search-icon { position: absolute; right: 14px; fill: #94a3b8; width: 20px; height: 20px; }

    .launcher-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; overflow-y: auto; max-height: 420px; padding-right: 4px; }
    .launcher-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 18px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: all 0.2s ease; }
    .launcher-card:hover { background: rgba(16, 185, 129, 0.1); border-color: var(--accent); transform: translateY(-2px); }
    .launcher-card-svg { width: 32px; height: 32px; fill: var(--accent); }
    .launcher-card-title { font-size: 12px; font-weight: 500; color: #e2e8f0; text-align: center; }

    /* Taskbar Dock */
    #dock-container { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10000; }
    #capsule-dock { height: 56px; background: #09111e; border: 1px solid var(--border); border-radius: 28px; backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 18px; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    .dock-btn-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; }
    .dock-btn { background: transparent; border: none; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 50%; transition: transform 0.2s; }
    .dock-btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.08); }
    .dock-indicator { position: absolute; bottom: -2px; width: 16px; height: 3px; background: var(--accent); border-radius: 2px; box-shadow: 0 0 8px var(--accent); display: none; }
    .dock-btn-wrapper.active .dock-indicator { display: block; }
    .dock-svg { width: 22px; height: 22px; fill: var(--accent); }
    .dock-divider { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.15); margin: 0 4px; }
    .dock-clock { font-size: 13px; color: #f8fafc; font-weight: 500; margin-left: 6px; }

    /* Floating Windows */
    .window {
      position: absolute;
      width: 780px;
      height: 520px;
      max-width: 95vw;
      max-height: 85vh;
      background: var(--window-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    .window-header { height: 38px; background: rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; cursor: move; border-bottom: 1px solid var(--border); }
    .window-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .window-controls { display: flex; gap: 8px; }
    .control-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
    .btn-close { background: #ef4444; }
    .btn-min { background: #f59e0b; }
    .btn-max { background: var(--accent); }

    .window-content { flex: 1; display: flex; flex-direction: column; overflow: auto; background: #080c14; position: relative; }
    .app-container { padding: 20px; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    /* Specific App Toolbars & Elements */
    .browser-bar { display: flex; gap: 8px; padding: 10px; background: #111827; border-bottom: 1px solid var(--border); align-items: center; }
    .browser-btn { background: #1f2937; border: 1px solid var(--border); color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .browser-btn:hover { background: var(--accent); color: #000; }
    .browser-input { flex: 1; background: #1f2937; border: 1px solid var(--border); color: #fff; padding: 7px 12px; border-radius: 6px; font-size: 13px; outline: none; }

    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .app-card { background: #1e293b; border: 1px solid var(--border); padding: 14px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; text-align: center; align-items: center; justify-content: space-between; }

    .store-tab-bar { display: flex; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px; overflow-x: auto; }
    .store-tab { padding: 6px 12px; border-radius: 6px; background: rgba(255,255,255,0.05); font-size: 12px; cursor: pointer; white-space: nowrap; }
    .store-tab.active { background: var(--accent); color: #000; font-weight: bold; }

    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: var(--accent); color: #000; padding: 12px 20px; border-radius: 8px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.4); pointer-events: auto; }
  </style>
</head>

      const tracks = await getTopTracks();
      if (tracks && tracks.length > 0) {
        out.innerText = tracks.map(t => `🎵 ${t.name} - ${t.artists.map(a => a.name).join(', ')}`).join('\n');
      } else {
        out.innerText = "Spotify API Token expired or restricted. (Check console logs for details).\nFallback: Top Track -> Emerald Waves by Nautilus Team";
      }
    }

    /* Photos Access Permission Engine */
    function requestPhotosAccess(winId) {
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.accept = 'image/*';
      input.onchange = (e) => {
        const gallery = document.getElementById(`photo-gallery-${winId}`);
        gallery.innerHTML = '';
        Array.from(e.target.files).forEach(file => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const card = document.createElement('div');
            card.style.background = '#1e293b';
            card.style.padding = '6px';
            card.style.borderRadius = '6px';
            card.innerHTML = `<img src="${ev.target.result}" style="width:100%; height:100px; object-fit:cover; border-radius:4px;"><p style="font-size:10px; margin-top:4px;">${file.name}</p>`;
            gallery.appendChild(card);
          };
          reader.readAsDataURL(file);
        });
        showToast('Photos Library Synchronized!');
      };
      input.click();
    }

    /* Calculator Helpers */
    function calcAppend(val) {
      const disp = document.getElementById('calc-display');
      if (disp.value === '0') disp.value = '';
      disp.value += val;
    }
    function calcEval() {
      const disp = document.getElementById('calc-display');
      try { disp.value = eval(disp.value); } catch(e) { disp.value = 'Error'; }
    }

    /* App Store Filter Tabs */
    function switchStoreTab(elem, cat, winId) {
      document.querySelectorAll('.store-tab').forEach(t => t.classList.remove('active'));
      elem.classList.add('active');
      renderStoreGrid(winId, cat);
    }

    function renderStoreGrid(winId, category = 'all') {
      const grid = document.getElementById(`store-grid-${winId}`);
      if (!grid) return;
      grid.innerHTML = '';

      baseAppsCatalog.filter(app => category === 'all' || app.cat === category).forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-card';
        const isInstalled = installedApps.includes(app.id);
        card.innerHTML = `
          <h4 style="font-size:13px;">${app.name}</h4>
          <button class="browser-btn" style="${isInstalled ? 'background:#ef4444;' : ''}" onclick="toggleAppInstall('${app.id}', '${winId}')">
            ${isInstalled ? 'Uninstall' : 'Install'}
          </button>`;
        grid.appendChild(card);
      });
    }

    function toggleAppInstall(appId, winId) {
      if (installedApps.includes(appId)) {
        installedApps = installedApps.filter(id => id !== appId);
        showToast(`Uninstalled ${appId}`);
      } else {
        installedApps.push(appId);
        showToast(`Installed ${appId}`);
      }
      localStorage.setItem('nautilus_installed_v9', JSON.stringify(installedApps));
      renderDesktop();
      renderStoreGrid(winId, 'all');
    }

    function closeWindow(appId, winId) {
      document.getElementById(winId)?.remove();
      delete openWindows[appId];
      updateTaskbarIndicators();
    }

    function executeNav(winId) {
      let val = document.getElementById(`url-${winId}`).value.trim();
      if (!val) return;
      if (!val.startsWith('http')) val = `https://www.bing.com/search?q=${encodeURIComponent(val)}`;
      document.getElementById(`frame-${winId}`).src = val;
    }

    function dragWindow(e, id) {
      const win = document.getElementById(id);
      let shiftX = e.clientX - win.getBoundingClientRect().left;
      let shiftY = e.clientY - win.getBoundingClientRect().top;
      document.onmousemove = (e) => {
        win.style.left = (e.clientX - shiftX) + 'px';
        win.style.top = (e.clientY - shiftY) + 'px';
      };
      document.onmouseup = () => document.onmousemove = null;
    }

    function maximizeWindow(id) {
      const win = document.getElementById(id);
      win.style.width = win.style.width === '100vw' ? '780px' : '100vw';
      win.style.height = win.style.height === 'calc(100vh - 80px)' ? '520px' : 'calc(100vh - 80px)';
    }

    /* Cool Canvas Effects Engine */
    let fxInterval = null;
    function clearEffects() {
      clearInterval(fxInterval);
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }

    function triggerMatrixEffect() {
      clearEffects();
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const chars = '0110101010111';
      const drops = Array(Math.floor(canvas.width / 20)).fill(1);

      fxInterval = setInterval(() => {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#10b981';
        ctx.font = '15px monospace';
        drops.forEach((y, i) => {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * 20, y * 20);
          if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        });
      }, 33);
    }

    function triggerFireworks() {
      clearEffects();
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      fxInterval = setInterval(() => {
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = `hsl(${Math.random()*360}, 100%, 50%)`;
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height / 2;
        for (let i = 0; i < 30; i++) {
          ctx.beginPath();
          ctx.arc(x + (Math.random()-0.5)*100, y + (Math.random()-0.5)*100, 3, 0, Math.PI*2);
          ctx.fill();
        }
      }, 300);
    }

    renderDesktop();
    setTimeout(() => { openApp('whatsnew'); }, 3500);
  </script>
</body>
</html>
