<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmeraldOS</title>
  <style>
    :root {
      --bg-color: #0b1912;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --panel-bg: rgba(16, 24, 20, 0.85);
      --window-bg: rgba(20, 30, 25, 0.95);
      --text-color: #ecfdf5;
      --border-color: rgba(16, 185, 129, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #064e3b 0%, #022c22 100%);
      height: 100vh;
      overflow: hidden;
      color: var(--text-color);
    }

    #desktop {
      width: 100vw;
      height: calc(100vh - 48px);
      position: relative;
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 20px;
    }

    .icon {
      width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      padding: 10px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .icon:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .icon-svg {
      width: 48px;
      height: 48px;
      fill: var(--accent-color);
    }

    .icon-label {
      font-size: 12px;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .window {
      position: absolute;
      width: 800px;
      height: 520px;
      background: var(--window-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 320px;
      min-height: 200px;
      z-index: 10;
    }

    .window-header {
      height: 38px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      cursor: move;
      border-bottom: 1px solid var(--border-color);
    }

    .window-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .control-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .btn-close { background: #ef4444; }
    .btn-min { background: #f59e0b; }
    .btn-max { background: #10b981; }

    .window-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
    }

    /* Browser Bar */
    .browser-bar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #111827;
      border-bottom: 1px solid #374151;
    }

    .browser-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .browser-btn:hover {
      background: #374151;
    }

    .browser-input {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .browser-frame {
      width: 100%;
      flex: 1;
      border: none;
      background: #ffffff;
    }

    /* App Store Styles */
    .store-grid {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      overflow-y: auto;
      background: #0f172a;
      height: 100%;
    }

    .store-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .store-card-icon {
      font-size: 36px;
    }

    .store-card-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .store-card-btn:hover {
      background: var(--accent-hover);
    }

    /* Taskbar */
    #taskbar {
      height: 48px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      position: absolute;
      bottom: 0;
      width: 100vw;
      z-index: 1000;
    }

    .start-btn {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    #start-menu {
      position: absolute;
      bottom: 58px;
      left: 12px;
      width: 280px;
      background: var(--window-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      backdrop-filter: blur(20px);
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 1001;
    }

    .menu-item {
      padding: 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .menu-item:hover {
      background: rgba(16, 185, 129, 0.15);
    }
  </style>
</head>
<body>

  <div id="desktop">
    <div class="icon" onclick="openApp('browser')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      <span class="icon-label">Emerald Browser</span>
    </div>
    <div class="icon" onclick="openApp('store')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12z"/></svg>
      <span class="icon-label">App Store</span>
    </div>
  </div>

  <div id="start-menu">
    <div class="menu-item" onclick="openApp('browser'); toggleStartMenu();">🌐 Emerald Browser</div>
    <div class="menu-item" onclick="openApp('store'); toggleStartMenu();">🛍️ App Store</div>
  </div>

  <div id="taskbar">
    <button class="start-btn" onclick="toggleStartMenu()">💎 Emerald</button>
    <div id="clock">12:00 PM</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    let activeZIndex = 100;

    function openApp(appType, customUrl) {
      const windowId = 'win-' + Date.now();
      let title = 'App';
      let content = '';

      if (appType === 'browser') {
        title = 'Emerald Browser';
        const initialUrl = customUrl || 'https://wikipedia.org';
        content = `
          <div class="browser-bar">
            <button class="browser-btn" onclick="document.getElementById('frame-${windowId}').contentWindow.history.back()">◄</button>
            <button class="browser-btn" onclick="document.getElementById('frame-${windowId}').contentWindow.history.forward()">►</button>
            <button class="browser-btn" onclick="reloadFrame('${windowId}')">↻</button>
            <input type="text" class="browser-input" id="url-${windowId}" value="${initialUrl}" onkeydown="if(event.key==='Enter') navigateFrame('${windowId}')">
            <button class="browser-btn" onclick="navigateFrame('${windowId}')">Go</button>
            <button class="browser-btn" title="Open in new tab if blocked" onclick="openExternal('${windowId}')">↗ Open External</button>
          </div>
          <iframe id="frame-${windowId}" class="browser-frame" src="${initialUrl}"></iframe>
        `;
      } else if (appType === 'store') {
        title = 'App Store';
        content = `
          <div class="store-grid">
            <div class="store-card">
              <div class="store-card-icon">📚</div>
              <h3>Wikipedia</h3>
              <p>Free online encyclopedia.</p>
              <button class="store-card-btn" onclick="openApp('browser', 'https://wikipedia.org')">Launch</button>
            </div>
            <div class="store-card">
              <div class="store-card-icon">🎮</div>
              <h3>2048 Game</h3>
              <p>Play the 2048 puzzle app.</p>
              <button class="store-card-btn" onclick="openApp('browser', 'https://play2048.co')">Launch</button>
            </div>
            <div class="store-card">
              <div class="store-card-icon">🎨</div>
              <h3>Excalidraw</h3>
              <p>Virtual whiteboard tool.</p>
              <button class="store-card-btn" onclick="openApp('browser', 'https://excalidraw.com')">Launch</button>
            </div>
          </div>
        `;
      }

      const win = document.createElement('div');
      win.className = 'window';
      win.id = windowId;
      win.style.top = '70px';
      win.style.left = '90px';
      win.style.zIndex = ++activeZIndex;

      win.innerHTML = `
        <div class="window-header" onmousedown="dragWindow(event, '${windowId}')">
          <div class="window-title">💎 ${title}</div>
          <div class="window-controls">
            <button class="control-btn btn-min" onclick="minimizeWindow('${windowId}')"></button>
            <button class="control-btn btn-max" onclick="maximizeWindow('${windowId}')"></button>
            <button class="control-btn btn-close" onclick="closeWindow('${windowId}')"></button>
          </div>
        </div>
        <div class="window-content">${content}</div>
      `;

      win.addEventListener('mousedown', () => win.style.zIndex = ++activeZIndex);
      document.body.appendChild(win);
    }

    function closeWindow(id) { document.getElementById(id).remove(); }
    function minimizeWindow(id) { document.getElementById(id).style.display = 'none'; }
    
    function maximizeWindow(id) {
      const win = document.getElementById(id);
      if (win.style.width === '100vw') {
        win.style.width = '800px';
        win.style.height = '520px';
        win.style.top = '70px';
        win.style.left = '90px';
      } else {
        win.style.width = '100vw';
        win.style.height = 'calc(100vh - 48px)';
        win.style.top = '0';
        win.style.left = '0';
      }
    }

    function dragWindow(e, id) {
      const win = document.getElementById(id);
      let shiftX = e.clientX - win.getBoundingClientRect().left;
      let shiftY = e.clientY - win.getBoundingClientRect().top;

      function moveAt(pageX, pageY) {
        win.style.left = pageX - shiftX + 'px';
        win.style.top = pageY - shiftY + 'px';
      }

      function onMouseMove(event) { moveAt(event.clientX, event.clientY); }
      document.addEventListener('mousemove', onMouseMove);
      document.onmouseup = function() {
        document.removeEventListener('mousemove', onMouseMove);
        document.onmouseup = null;
      };
    }

    function navigateFrame(id) {
      const input = document.getElementById(`url-${id}`);
      const frame = document.getElementById(`frame-${id}`);
      let url = input.value.trim();

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      frame.src = url;
      input.value = url;
    }

    function reloadFrame(id) {
      const frame = document.getElementById(`frame-${id}`);
      frame.src = frame.src;
    }

    function openExternal(id) {
      const input = document.getElementById(`url-${id}`);
      window.open(input.value, '_blank');
    }
  </script>
</body>
</html>
