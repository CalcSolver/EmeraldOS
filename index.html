<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmeraldOS Core</title>
  <script async src="https://cse.google.com/cse.js?cx=972b63ac093654a7a"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #064e3b 0%, #022c22 100%);
      --accent-color: #10b981;
      --accent-hover: #059669;
      --panel-bg: rgba(16, 24, 20, 0.85);
      --window-bg: rgba(20, 30, 25, 0.95);
      --text-color: #ecfdf5;
      --border-color: rgba(16, 185, 129, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      height: 100vh;
      overflow: hidden;
      color: var(--text-color);
      transition: background 0.3s ease;
    }

    /* Desktop Area */
    #desktop {
      width: 100vw;
      height: calc(100vh - 48px);
      position: relative;
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 20px;
    }

    .icon {
      width: 88px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      padding: 10px;
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .icon:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .icon-svg {
      width: 44px;
      height: 44px;
      fill: var(--accent-color);
    }

    .icon-label {
      font-size: 12px;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* Window System */
    .window {
      position: absolute;
      width: 820px;
      height: 520px;
      background: var(--window-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 340px;
      min-height: 220px;
      z-index: 10;
    }

    .window-header {
      height: 38px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      cursor: move;
      border-bottom: 1px solid var(--border-color);
    }

    .window-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .control-btn {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .btn-close { background: #ef4444; }
    .btn-min { background: #f59e0b; }
    .btn-max { background: var(--accent-color); }

    .window-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    /* Browser Tabs System */
    .browser-tabs {
      display: flex;
      background: #090d16;
      border-bottom: 1px solid #374151;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 6px 14px;
      background: #111827;
      border: none;
      border-right: 1px solid #374151;
      color: #9ca3af;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 160px;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: #1f2937;
      color: #fff;
      font-weight: bold;
    }

    .close-tab-btn {
      font-size: 10px;
      color: #ef4444;
      cursor: pointer;
      border-radius: 50%;
      padding: 0 4px;
    }

    .close-tab-btn:hover { background: rgba(239, 68, 68, 0.2); }

    .add-tab-btn {
      padding: 6px 12px;
      background: transparent;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      font-weight: bold;
    }

    /* Browser Navigation Bar */
    .browser-bar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #111827;
      border-bottom: 1px solid #374151;
      align-items: center;
    }

    .browser-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .browser-btn:hover { background: #374151; }

    .browser-input {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .browser-viewport {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      background: #0f172a;
    }

    .browser-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    .browser-home {
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      gap: 20px;
    }

    .home-logo {
      font-size: 38px;
      font-weight: 700;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .gcse-container {
      width: 100%;
      max-width: 650px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
    }

    /* Common View */
    .app-container {
      padding: 20px;
      background: #0f172a;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Terminal */
    .terminal-container {
      background: #090d16;
      color: #38bdf8;
      font-family: 'Consolas', 'Courier New', monospace;
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    .terminal-output {
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .terminal-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .terminal-prompt {
      color: var(--accent-color);
      font-weight: bold;
    }

    .terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
    }

    /* Profile UI */
    .profile-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-color);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }

    /* Achievements Grid */
    .achieve-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .achieve-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .achieve-card.unlocked {
      border-color: var(--accent-color);
      background: rgba(16, 185, 129, 0.1);
    }

    /* Taskbar & Start Menu */
    #taskbar {
      height: 48px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      position: absolute;
      bottom: 0;
      width: 100vw;
      z-index: 1000;
    }

    .start-btn {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    #start-menu {
      position: absolute;
      bottom: 58px;
      left: 12px;
      width: 280px;
      background: var(--window-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      backdrop-filter: blur(20px);
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 1001;
    }

    .menu-item {
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .menu-item:hover { background: rgba(16, 185, 129, 0.15); }

    /* Toast Notifications */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #10b981;
      color: #000;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div id="desktop">
    <div class="icon" onclick="openApp('browser')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      <span class="icon-label">Emerald Browser</span>
    </div>
    <div class="icon" onclick="openApp('entertainment')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v2H6v-2H4v-2h2V9h2v2h3v2zm4.5 1c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5-1.5z"/></svg>
      <span class="icon-label">Entertainment</span>
    </div>
    <div class="icon" onclick="openApp('notes')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      <span class="icon-label">Notes</span>
    </div>
    <div class="icon" onclick="openApp('terminal')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.11-.9-2-2-2zm0 14H4V8h16v10zm-2-1h-6v-2h6v2zm-9.41-1.41L11.17 13l-2.58-2.59L10 9l4 4-4 4-1.41-1.41z"/></svg>
      <span class="icon-label">Terminal</span>
    </div>
    <div class="icon" onclick="openApp('achievements')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
      <span class="icon-label">Achievements</span>
    </div>
    <div class="icon" onclick="openApp('settings')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></svg>
      <span class="icon-label">Settings</span>
    </div>
    <div class="icon" onclick="openApp('store')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12z"/></svg>
      <span class="icon-label">App Store</span>
    </div>
  </div>

  <div id="start-menu">
    <div class="menu-item" onclick="openApp('browser'); toggleStartMenu();">🌐 Emerald Browser</div>
    <div class="menu-item" onclick="openApp('entertainment'); toggleStartMenu();">🎮 Entertainment</div>
    <div class="menu-item" onclick="openApp('notes'); toggleStartMenu();">📝 Notes</div>
    <div class="menu-item" onclick="openApp('terminal'); toggleStartMenu();">💻 Terminal</div>
    <div class="menu-item" onclick="openApp('achievements'); toggleStartMenu();">🏆 Achievements</div>
    <div class="menu-item" onclick="openApp('settings'); toggleStartMenu();">⚙️ Settings</div>
    <div class="menu-item" onclick="openApp('store'); toggleStartMenu();">🛍️ App Store</div>
  </div>

  <div id="taskbar">
    <button class="start-btn" onclick="toggleStartMenu()">💎 Emerald</button>
    <div id="clock">12:00 PM</div>
  </div>

  <script>
    /* System Profile Storage */
    let userProfile = JSON.parse(localStorage.getItem('emerald_profile')) || {
      username: 'EmeraldExplorer',
      title: 'Power User',
      avatar: '💎'
    };

    function saveProfile() {
      localStorage.setItem('emerald_profile', JSON.stringify(userProfile));
      showToast('Profile updated!');
    }

    /* System Achievements (30 Total + 5 Easter Eggs) */
    const achievementList = [
      { id: 'first_boot', title: 'First Boot', desc: 'Loaded EmeraldOS for the first time.' },
      { id: 'browser_open', title: 'Surfer', desc: 'Opened Emerald Browser.' },
      { id: 'notes_save', title: 'Scribe', desc: 'Saved a note in the Notes app.' },
      { id: 'terminal_user', title: 'Hacker', desc: 'Ran a command in Terminal.' },
      { id: 'entertainment_open', title: 'Gamer', desc: 'Launched Entertainment.' },
      { id: 'settings_visit', title: 'Tinker', desc: 'Opened Settings.' },
      { id: 'theme_change', title: 'Stylist', desc: 'Changed OS theme.' },
      { id: 'matrix_mode', title: 'The One', desc: 'Ran the matrix terminal command.' },
      { id: 'tab_master', title: 'Tab Collector', desc: 'Opened a new tab in browser.' },
      { id: 'store_visit', title: 'Shopper', desc: 'Opened the App Store.' },
      { id: 'easter_secret1', title: '🕵️ Secret 1: Konami', desc: 'Secret Easter Egg 1 unlocked.' },
      { id: 'easter_secret2', title: '🕵️ Secret 2: Emerald OS', desc: 'Secret Easter Egg 2 unlocked.' },
      { id: 'easter_secret3', title: '🕵️ Secret 3: Midnight', desc: 'Secret Easter Egg 3 unlocked.' },
      { id: 'easter_secret4', title: '🕵️ Secret 4: Terminal Master', desc: 'Secret Easter Egg 4 unlocked.' },
      { id: 'easter_secret5', title: '🕵️ Secret 5: Overclock', desc: 'Secret Easter Egg 5 unlocked.' },
      // Generic Progression Milestones (6 - 30)
      ...Array.from({ length: 15 }, (_, i) => ({
        id: `milestone_${i + 6}`,
        title: `Milestone ${i + 6}`,
        desc: `Explored system feature level ${i + 6}.`
      }))
    ];

    let unlockedAchievements = JSON.parse(localStorage.getItem('emerald_achievements')) || ['first_boot'];

    function unlockAchievement(id) {
      if (!unlockedAchievements.includes(id)) {
        unlockedAchievements.push(id);
        localStorage.setItem('emerald_achievements', JSON.stringify(unlockedAchievements));
        const item = achievementList.find(a => a.id === id);
        if (item) showToast(`🏆 Achievement Unlocked: ${item.title}`);
      }
    }

    /* Basic Setup */
    function updateClock() {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    let activeZIndex = 100;
    const browserTabsState = {};

    /* Main Window & App Launcher */
    function openApp(appType, customUrl) {
      const windowId = 'win-' + Date.now();
      let title = 'Application';
      let content = '';

      if (appType === 'browser') {
        title = 'Emerald Browser';
        unlockAchievement('browser_open');
        browserTabsState[windowId] = [{ id: 'tab-1', url: customUrl || 'emerald://home' }];
        content = renderBrowserLayout(windowId);
      } else if (appType === 'entertainment') {
        title = 'Entertainment';
        unlockAchievement('entertainment_open');
        content = `<iframe src="https://tuesdae.vercel.app" style="width:100%; height:100%; border:none; background:#0f172a;"></iframe>`;
      } else if (appType === 'notes') {
        title = 'Notes';
        const savedNote = localStorage.getItem('emerald_saved_note') || '';
        content = `
          <div class="app-container" style="padding:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <span style="font-size:12px; color:#10b981;">Auto-Saves to Local Storage</span>
              <button class="browser-btn" onclick="saveNotes('${windowId}')">Save Note</button>
            </div>
            <textarea id="notes-input-${windowId}" style="width:100%; height:88%; background:#0f172a; color:#fff; border:1px solid #334155; padding:12px; border-radius:6px; outline:none; resize:none;" oninput="autoSaveNotes(this.value)" placeholder="Start typing...">${savedNote}</textarea>
          </div>
        `;
      } else if (appType === 'terminal') {
        title = 'Terminal';
        unlockAchievement('terminal_user');
        content = `
          <div class="terminal-container" id="term-container-${windowId}">
            <div class="terminal-output" id="term-out-${windowId}">EmeraldOS Terminal Engine v4.0\nType "help" for a full list of commands.\n</div>
            <div class="terminal-input-row">
              <span class="terminal-prompt">emerald@user:~$</span>
              <input type="text" class="terminal-input" id="term-in-${windowId}" onkeydown="handleTerminalKey(event, '${windowId}')" autofocus>
            </div>
          </div>
        `;
      } else if (appType === 'settings') {
        title = 'Settings';
        unlockAchievement('settings_visit');
        content = renderSettingsContent();
      } else if (appType === 'achievements') {
        title = 'Achievements';
        content = renderAchievementsContent();
      } else if (appType === 'store') {
        title = 'App Store';
        unlockAchievement('store_visit');
        content = `
          <div class="app-container">
            <h2>Core Applications</h2>
            <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:16px;">
              <div style="background:#1e293b; border:1px solid #334155; padding:16px; border-radius:8px; text-align:center;">
                <h3>Entertainment</h3>
                <p style="font-size:12px; color:#94a3b8; margin:8px 0;">Pre-installed Web App</p>
                <button class="browser-btn" onclick="openApp('entertainment')">Launch</button>
              </div>
              <div style="background:#1e293b; border:1px solid #334155; padding:16px; border-radius:8px; text-align:center;">
                <h3>Emerald Browser</h3>
                <p style="font-size:12px; color:#94a3b8; margin:8px 0;">Web Navigation Engine</p>
                <button class="browser-btn" onclick="openApp('browser')">Launch</button>
              </div>
            </div>
          </div>
        `;
      }

      const win = document.createElement('div');
      win.className = 'window';
      win.id = windowId;
      win.style.top = '60px';
      win.style.left = '80px';
      win.style.zIndex = ++activeZIndex;

      win.innerHTML = `
        <div class="window-header" onmousedown="dragWindow(event, '${windowId}')">
          <div class="window-title">💎 ${title}</div>
          <div class="window-controls">
            <button class="control-btn btn-min" onclick="minimizeWindow('${windowId}')"></button>
            <button class="control-btn btn-max" onclick="maximizeWindow('${windowId}')"></button>
            <button class="control-btn btn-close" onclick="closeWindow('${windowId}')"></button>
          </div>
        </div>
        <div class="window-content">${content}</div>
      `;

      win.addEventListener('mousedown', () => win.style.zIndex = ++activeZIndex);
      document.body.appendChild(win);

      if (customUrl && appType === 'browser') {
        document.getElementById(`url-${windowId}`).value = customUrl;
        navigateFrame(windowId);
      }
    }

    function closeWindow(id) { document.getElementById(id).remove(); }
    function minimizeWindow(id) { document.getElementById(id).style.display = 'none'; }
    
    function maximizeWindow(id) {
      const win = document.getElementById(id);
      if (win.style.width === '100vw') {
        win.style.width = '820px';
        win.style.height = '520px';
        win.style.top = '60px';
        win.style.left = '80px';
      } else {
        win.style.width = '100vw';
        win.style.height = 'calc(100vh - 48px)';
        win.style.top = '0';
        win.style.left = '0';
      }
    }

    function dragWindow(e, id) {
      const win = document.getElementById(id);
      let shiftX = e.clientX - win.getBoundingClientRect().left;
      let shiftY = e.clientY - win.getBoundingClientRect().top;

      function moveAt(pageX, pageY) {
        win.style.left = pageX - shiftX + 'px';
        win.style.top = pageY - shiftY + 'px';
      }

      function onMouseMove(event) { moveAt(event.clientX, event.clientY); }
      document.addEventListener('mousemove', onMouseMove);
      document.onmouseup = function() {
        document.removeEventListener('mousemove', onMouseMove);
        document.onmouseup = null;
      };
    }

    /* Notes Engine */
    function autoSaveNotes(val) {
      localStorage.setItem('emerald_saved_note', val);
    }

    function saveNotes(winId) {
      const val = document.getElementById(`notes-input-${winId}`).value;
      localStorage.setItem('emerald_saved_note', val);
      unlockAchievement('notes_save');
      showToast('Notes saved successfully!');
    }

    /* Browser Engine with Google CSE */
    function renderBrowserLayout(winId) {
      return `
        <div class="browser-tabs" id="tabs-bar-${winId}">
          ${renderTabButtons(winId)}
          <button class="add-tab-btn" onclick="addNewTab('${winId}')">+</button>
        </div>
        <div class="browser-bar">
          <button class="browser-btn" onclick="goHome('${winId}')">🏠</button>
          <button class="browser-btn" onclick="reloadFrame('${winId}')">↻</button>
          <input type="text" class="browser-input" id="url-${winId}" value="emerald://home" onkeydown="if(event.key==='Enter') navigateFrame('${winId}')">
          <button class="browser-btn" onclick="navigateFrame('${winId}')">Go</button>
        </div>
        <div class="browser-viewport" id="viewport-${winId}">
          ${getHomeMarkup(winId)}
        </div>
      `;
    }

    function renderTabButtons(winId) {
      const tabs = browserTabsState[winId] || [];
      return tabs.map((t, idx) => `
        <button class="tab-btn ${idx === 0 ? 'active' : ''}" onclick="switchTab('${winId}')">
          Tab ${idx + 1}
          <span class="close-tab-btn" onclick="event.stopPropagation(); closeTab('${winId}', '${t.id}')">✕</span>
        </button>
      `).join('');
    }

    function addNewTab(winId) {
      unlockAchievement('tab_master');
      const newTabId = 'tab-' + Date.now();
      browserTabsState[winId].push({ id: newTabId, url: 'emerald://home' });
      document.getElementById(`tabs-bar-${winId}`).innerHTML = renderTabButtons(winId) + `<button class="add-tab-btn" onclick="addNewTab('${winId}')">+</button>`;
      goHome(winId);
    }

    function switchTab(winId) { goHome(winId); }

    function closeTab(winId, tabId) {
      if (browserTabsState[winId].length <= 1) return;
      browserTabsState[winId] = browserTabsState[winId].filter(t => t.id !== tabId);
      document.getElementById(`tabs-bar-${winId}`).innerHTML = renderTabButtons(winId) + `<button class="add-tab-btn" onclick="addNewTab('${winId}')">+</button>`;
    }

    function getHomeMarkup(winId) {
      setTimeout(() => {
        if (window.google && window.google.search && window.google.search.cse) {
          window.google.search.cse.element.go();
        }
      }, 300);

      return `
        <div class="browser-home">
          <div class="home-logo">💎 Emerald Search</div>
          <div class="gcse-container">
            <div class="gcse-search"></div>
          </div>
        </div>
      `;
    }

    function goHome(winId) {
      const viewport = document.getElementById(`viewport-${winId}`);
      const input = document.getElementById(`url-${winId}`);
      if (input) input.value = "emerald://home";
      viewport.innerHTML = getHomeMarkup(winId);
    }

    function navigateFrame(winId) {
      const input = document.getElementById(`url-${winId}`);
      const viewport = document.getElementById(`viewport-${winId}`);
      let url = input.value.trim();

      if (url === 'emerald://home' || url === 'home') {
        goHome(winId);
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      input.value = url;

      viewport.innerHTML = `<iframe id="frame-${winId}" class="browser-frame" src="${url}"></iframe>`;
    }

    function reloadFrame(winId) { navigateFrame(winId); }

    /* Expanded Terminal Command Engine */
    function handleTerminalKey(event, winId) {
      if (event.key === 'Enter') {
        const inputElem = document.getElementById(`term-in-${winId}`);
        const outputElem = document.getElementById(`term-out-${winId}`);
        const command = inputElem.value.trim();
        inputElem.value = '';

        outputElem.innerText += `\nemerald@user:~$ ${command}\n`;
        const parts = command.split(' ');
        const cmd = parts[0].toLowerCase();

        switch (cmd) {
          case 'help':
            outputElem.innerText += `Commands: help, clear, ver, date, sysinfo, matrix, calc, whoami, storage, time, theme, apps, unlockall\n`;
            break;
          case 'clear':
            outputElem.innerText = '';
            break;
          case 'ver':
            outputElem.innerText += `EmeraldOS v4.0 Ultimate Edition\n`;
            break;
          case 'date':
          case 'time':
            outputElem.innerText += `${new Date().toString()}\n`;
            break;
          case 'sysinfo':
            outputElem.innerText += `OS: EmeraldOS Core v4.0\nMemory: 512MB / 4096MB Allocated\nStatus: Operational\n`;
            break;
          case 'whoami':
            outputElem.innerText += `User: ${userProfile.username} (${userProfile.title})\n`;
            break;
          case 'calc':
            try {
              outputElem.innerText += `Result: ${eval(parts.slice(1).join(' '))}\n`;
            } catch (e) {
              outputElem.innerText += `Usage: calc <expression>\n`;
            }
            break;
          case 'storage':
            outputElem.innerText += `Notes Size: ${(localStorage.getItem('emerald_saved_note') || '').length} bytes\n`;
            break;
          case 'matrix':
            unlockAchievement('matrix_mode');
            unlockAchievement('easter_secret4');
            outputElem.innerText += `Wake up, Neo...\nThe Matrix has you...\nFollow the white rabbit.\n`;
            break;
          case 'unlockall':
            achievementList.forEach(a => unlockAchievement(a.id));
            outputElem.innerText += `All achievements unlocked!\n`;
            break;
          case 'secret':
            unlockAchievement('easter_secret1');
            outputElem.innerText += `Easter Egg 1 Unlocked!\n`;
            break;
          default:
            if (cmd) outputElem.innerText += `Command not recognized: ${cmd}\n`;
        }

        const container = document.getElementById(`term-container-${winId}`);
        container.scrollTop = container.scrollHeight;
      }
    }

    /* Settings UI Builder */
    function renderSettingsContent() {
      return `
        <div class="app-container">
          <h2>Profile & Settings</h2>
          <div class="profile-card">
            <div class="profile-avatar">${userProfile.avatar}</div>
            <div style="flex:1;">
              <input type="text" class="browser-input" value="${userProfile.username}" onchange="userProfile.username=this.value; saveProfile();" style="margin-bottom:6px;">
              <input type="text" class="browser-input" value="${userProfile.title}" onchange="userProfile.title=this.value; saveProfile();">
            </div>
          </div>
          <div style="background:#1e293b; border:1px solid #334155; padding:16px; border-radius:8px;">
            <h3>Appearance Theme</h3>
            <div style="display:flex; gap:10px; margin-top:8px;">
              <button class="browser-btn" onclick="setTheme('emerald')">Emerald Green</button>
              <button class="browser-btn" onclick="setTheme('sapphire')">Sapphire Blue</button>
              <button class="browser-btn" onclick="setTheme('ruby')">Ruby Red</button>
            </div>
          </div>
        </div>
      `;
    }

    /* Achievements View Builder */
    function renderAchievementsContent() {
      return `
        <div class="app-container">
          <h2>Achievements (${unlockedAchievements.length} / ${achievementList.length})</h2>
          <div class="achieve-grid">
            ${achievementList.map(a => {
              const unlocked = unlockedAchievements.includes(a.id);
              return `
                <div class="achieve-card ${unlocked ? 'unlocked' : ''}">
                  <strong style="color:${unlocked ? '#10b981' : '#94a3b8'}">${a.title}</strong>
                  <span style="font-size:12px; color:#cbd5e1;">${a.desc}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    /* Themes Engine */
    function setTheme(theme) {
      unlockAchievement('theme_change');
      const root = document.documentElement;
      if (theme === 'emerald') {
        root.style.setProperty('--bg-gradient', 'radial-gradient(circle at center, #064e3b 0%, #022c22 100%)');
        root.style.setProperty('--accent-color', '#10b981');
      } else if (theme === 'sapphire') {
        root.style.setProperty('--bg-gradient', 'radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%)');
        root.style.setProperty('--accent-color', '#3b82f6');
      } else if (theme === 'ruby') {
        root.style.setProperty('--bg-gradient', 'radial-gradient(circle at center, #881337 0%, #18181b 100%)');
        root.style.setProperty('--accent-color', '#f43f5e');
      }
    }
  </script>
</body>
</html>
