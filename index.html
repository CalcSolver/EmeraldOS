<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emerald OS</title>
  <style>
    :root {
      --bg-color: #030712;
      --panel-bg: rgba(15, 23, 42, 0.90);
      --panel-border: rgba(16, 185, 129, 0.4);
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --window-header: linear-gradient(90deg, #064e3b, #047857);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-color);
      color: var(--text-main);
    }

    /* Desktop background */
    #desktop {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: radial-gradient(circle at center, #065f46 0%, #022c22 45%, #030712 100%);
      overflow: hidden;
    }

    /* 3D Background Canvas */
    #world3d-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    canvas#world3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Desktop Icons Overlay */
    #desktop-icons {
      position: absolute;
      top: 24px;
      left: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, 110px);
      grid-gap: 20px;
      z-index: 10;
      max-height: calc(100vh - 80px);
    }

    .icon-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100px;
      height: 100px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .icon-btn:hover {
      background: rgba(16, 185, 129, 0.25);
      border-color: var(--accent-color);
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
    }

    .icon-btn span {
      font-size: 32px;
      margin-bottom: 6px;
    }

    .icon-btn label {
      font-size: 11px;
      text-align: center;
      font-weight: 600;
      pointer-events: none;
      line-height: 1.2;
    }

    /* Window System */
    .window {
      position: absolute;
      width: 700px;
      height: 480px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 20;
      min-width: 340px;
      min-height: 240px;
      animation: winOpen 0.2s ease-out;
    }

    @keyframes winOpen {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .window-header {
      height: 40px;
      background: var(--window-header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      cursor: move;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .window-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .win-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .win-close { background: #ef4444; }
    .win-minimize { background: #f59e0b; }

    .window-body {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(2, 6, 23, 0.7);
    }

    .iframe-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .iframe-bar {
      display: flex;
      gap: 8px;
    }

    .iframe-bar input {
      flex: 1;
    }

    iframe.app-iframe {
      width: 100%;
      height: 100%;
      flex: 1;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: #fff;
    }

    /* Start Menu Popup */
    #start-menu {
      position: absolute;
      bottom: 60px;
      left: 16px;
      width: 320px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
    }

    #start-menu.active {
      display: flex;
    }

    .start-menu-header {
      font-weight: 800;
      color: var(--accent-color);
      font-size: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }

    .start-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }

    .start-menu-item:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    /* Taskbar */
    #taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 52px;
      background: rgba(2, 6, 23, 0.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }

    #start-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      margin-right: 16px;
      font-size: 13px;
      transition: all 0.2s;
    }

    #start-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.04);
    }

    .taskbar-items {
      display: flex;
      gap: 10px;
      flex: 1;
      overflow-x: auto;
    }

    .task-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .task-item:hover {
      background: rgba(16, 185, 129, 0.3);
      border-color: var(--accent-color);
    }

    #system-time {
      font-size: 13px;
      font-weight: 700;
      margin-left: auto;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    /* Controls & Utilities */
    .btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    input[type="text"], input[type="file"], select {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      width: 100%;
      font-size: 13px;
      outline: none;
    }

    .app-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Achievements Notification */
    #achievement-toast {
      position: absolute;
      top: 20px;
      right: -350px;
      background: var(--accent-color);
      color: #000;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }

    #achievement-toast.show {
      right: 20px;
    }
  </style>
</head>
<body>

  <div id="desktop">
    <!-- 3D World Canvas -->
    <div id="world3d-container">
      <canvas id="world3d"></canvas>
    </div>

    <!-- Desktop Icons -->
    <div id="desktop-icons"></div>

    <!-- JavaScript Popup Start Menu -->
    <div id="start-menu">
      <div class="start-menu-header">Emerald OS Menu</div>
      <div id="start-menu-list"></div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
      <button id="start-btn" onclick="toggleStartMenu()">Emerald</button>
      <div class="taskbar-items" id="taskbar-items"></div>
      <div id="system-time">--:-- --</div>
    </div>
  </div>

  <!-- Achievement Toast -->
  <div id="achievement-toast">🏆 Achievement Unlocked!</div>

  <script>
    // --- System State & App Catalog ---
    const state = {
      activeWindow: null,
      achievements: new Set()
    };

    const apps = [
      { id: 'gameshare', name: 'GameShare TUESDAE', icon: '🎮', render: renderGameShareIframe },
      { id: 'handwriter', name: 'AI Handwriter', icon: '✍️', render: renderHandwriterIframe },
      { id: 'radio', name: 'Triple M Live Radio', icon: '📻', render: renderRadio },
      { id: 'ultimatesys', name: 'Ultimate Ent System', icon: '🎰', render: renderUltimateEnt },
      { id: 'dash', name: 'Dash Experience', icon: '🏎️', render: renderDash },
      { id: 'appstore', name: 'Emerald App Store', icon: '🛍️', render: renderAppStore },
      { id: 'music', name: 'Music Player', icon: '🎵', render: renderMusic },
      { id: 'cursors', name: 'Custom Cursors', icon: '🖱️', render: renderCursorManager },
      { id: 'settings', name: 'System Settings', icon: '⚙️', render: renderSettings },
      { id: 'achievements', name: 'Achievements', icon: '🏆', render: renderAchievements }
    ];

    // --- Core Window Manager ---
    function openApp(appId) {
      closeStartMenu();
      const app = apps.find(a => a.id === appId);
      if (!app) return;

      const existingWin = document.getElementById(`win-${appId}`);
      if (existingWin) {
        existingWin.style.display = 'flex';
        focusWindow(existingWin);
        return;
      }

      const win = document.createElement('div');
      win.id = `win-${appId}`;
      win.className = 'window';
      win.style.left = `${60 + Math.random() * 80}px`;
      win.style.top = `${30 + Math.random() * 60}px`;

      win.innerHTML = `
        <div class="window-header">
          <span class="window-title">${app.icon} ${app.name}</span>
          <div class="window-controls">
            <button class="win-btn win-minimize" onclick="minimizeWindow('${appId}')"></button>
            <button class="win-btn win-close" onclick="closeWindow('${appId}')"></button>
          </div>
        </div>
        <div class="window-body" id="body-${appId}"></div>
      `;

      document.getElementById('desktop').appendChild(win);
      makeDraggable(win);
      app.render(document.getElementById(`body-${appId}`));
      focusWindow(win);
      updateTaskbar();

      triggerAchievement('Opened ' + app.name, `Explorer: Opened ${app.name}`);
    }

    function closeWindow(appId) {
      const win = document.getElementById(`win-${appId}`);
      if (win) win.remove();
      updateTaskbar();
    }

    function minimizeWindow(appId) {
      const win = document.getElementById(`win-${appId}`);
      if (win) win.style.display = 'none';
    }

    function focusWindow(win) {
      document.querySelectorAll('.window').forEach(w => w.style.zIndex = 20);
      win.style.zIndex = 30;
      state.activeWindow = win;
    }

    function makeDraggable(win) {
      const header = win.querySelector('.window-header');
      let isDragging = false, offsetWX = 0, offsetWY = 0;

      header.addEventListener('mousedown', (e) => {
        isDragging = true;
        offsetWX = e.clientX - win.offsetLeft;
        offsetWY = e.clientY - win.offsetTop;
        focusWindow(win);
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        win.style.left = `${e.clientX - offsetWX}px`;
        win.style.top = `${e.clientY - offsetWY}px`;
      });

      document.addEventListener('mouseup', () => isDragging = false);
    }

    // --- Taskbar & Start Menu ---
    function toggleStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.classList.toggle('active');
    }

    function closeStartMenu() {
      document.getElementById('start-menu').classList.remove('active');
    }

    function renderStartMenu() {
      const list = document.getElementById('start-menu-list');
      list.innerHTML = '';
      apps.forEach(app => {
        const item = document.createElement('div');
        item.className = 'start-menu-item';
        item.innerHTML = `<span>${app.icon}</span> <span>${app.name}</span>`;
        item.onclick = () => openApp(app.id);
        list.appendChild(item);
      });
    }

    function updateTaskbar() {
      const container = document.getElementById('taskbar-items');
      container.innerHTML = '';
      document.querySelectorAll('.window').forEach(win => {
        const id = win.id.replace('win-', '');
        const app = apps.find(a => a.id === id);
        if (!app) return;
        const item = document.createElement('div');
        item.className = 'task-item';
        item.innerHTML = `${app.icon} ${app.name}`;
        item.onclick = () => {
          if (win.style.display === 'none') {
            win.style.display = 'flex';
            focusWindow(win);
          } else {
            minimizeWindow(id);
          }
        };
        container.appendChild(item);
      });
    }

    function renderDesktopIcons() {
      const container = document.getElementById('desktop-icons');
      container.innerHTML = '';
      apps.forEach(app => {
        const btn = document.createElement('div');
        btn.className = 'icon-btn';
        btn.innerHTML = `<span>${app.icon}</span><label>${app.name}</label>`;
        btn.onclick = () => openApp(app.id);
        container.appendChild(btn);
      });
    }

    // --- Specific App Renderers ---
    function renderGameShareIframe(el) {
      el.style.padding = '8px';
      el.innerHTML = `
        <div class="iframe-container">
          <div class="iframe-bar">
            <input type="text" id="gameshare-url" value="https://tuesdae.io" placeholder="Paste GameShare TUESDAE Website URL..." />
            <button class="btn" onclick="document.getElementById('gs-frame').src=document.getElementById('gameshare-url').value">Load Site</button>
          </div>
          <iframe id="gs-frame" class="app-iframe" src="https://tuesdae.io" allow="autoplay; fullscreen"></iframe>
        </div>
      `;
    }

    function renderHandwriterIframe(el) {
      el.style.padding = '8px';
      el.innerHTML = `
        <div class="iframe-container">
          <div class="iframe-bar">
            <input type="text" id="handwriter-url" value="https://www.calligrapher.ai" placeholder="Paste AI Handwriter URL..." />
            <button class="btn" onclick="document.getElementById('hw-frame').src=document.getElementById('handwriter-url').value">Load AI</button>
          </div>
          <iframe id="hw-frame" class="app-iframe" src="https://www.calligrapher.ai"></iframe>
        </div>
      `;
    }

    function renderRadio(el) {
      el.innerHTML = `
        <h3>📻 Triple M Radio Network</h3>
        <p style="color:var(--text-muted)">Live Australian Rock, Sport, and Entertainment.</p>
        <select id="radio-select">
          <option value="https://triplem.listnr.com/sydney/">Triple M Sydney 104.9 FM</option>
          <option value="https://triplem.listnr.com/melbourne/">Triple M Melbourne 105.1 FM</option>
          <option value="https://triplem.listnr.com/brisbane/">Triple M Brisbane 104.5 FM</option>
          <option value="https://s3.vocalware.com/g/groove.mp3">Alternative Classic Rock Stream</option>
        </select>
        <div style="margin-top:10px;">
          <button class="btn" onclick="window.open(document.getElementById('radio-select').value, '_blank')">Launch Station Player</button>
        </div>
        <audio id="radio-audio" controls style="width:100%; margin-top:14px;"></audio>
      `;
      setTimeout(() => {
        const select = document.getElementById('radio-select');
        const player = document.getElementById('radio-audio');
        if (select && player) {
          select.onchange = () => {
            if (select.value.endsWith('.mp3')) {
              player.src = select.value;
              player.play();
            } else {
              window.open(select.value, '_blank');
            }
          };
        }
      }, 50);
    }

    function renderUltimateEnt(el) {
      el.innerHTML = `
        <h3>The Ultimate Entertainment System</h3>
        <p style="color:var(--text-muted)">Hub for local media, cloud arcade, and media streams.</p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
          <div class="app-card">🕹️ Retro Arcade</div>
          <div class="app-card">🎬 Emerald Cinema</div>
          <div class="app-card">🎮 Cloud Gaming Hub</div>
          <div class="app-card">🎧 3D Spatial Sound</div>
        </div>
      `;
    }

    function renderDash(el) {
      el.innerHTML = `
        <h3>Dash for an Amazing Experience</h3>
        <p style="color:var(--text-muted)">System Turbo Engine and OS Cleaner.</p>
        <button class="btn" onclick="triggerAchievement('Turbo Dash', 'Speedster: Optimized system!'); alert('Emerald OS performance boosted!')">Boost OS Speed</button>
      `;
    }

    function renderAppStore(el) {
      el.innerHTML = `
        <h3>Emerald App Store</h3>
        <p style="color:var(--text-muted)">Discover and install additional Emerald applications.</p>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
          <div class="app-card">
            <span>🎨 Pixel Studio Pro</span>
            <button class="btn" onclick="alert('Installed Pixel Studio!')">Install</button>
          </div>
          <div class="app-card">
            <span>🌐 Web VR Browser</span>
            <button class="btn" onclick="alert('Installed Web VR Browser!')">Install</button>
          </div>
        </div>
      `;
    }

    function renderMusic(el) {
      el.innerHTML = `
        <h3>Emerald Music Player</h3>
        <p style="color:var(--text-muted)">Play custom audio files directly from your computer library.</p>
        <input type="file" id="music-file-input" accept="audio/*" />
        <audio id="local-audio-player" controls style="width:100%; margin-top:12px;"></audio>
      `;
      setTimeout(() => {
        const input = document.getElementById('music-file-input');
        const player = document.getElementById('local-audio-player');
        if (input && player) {
          input.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
              player.src = URL.createObjectURL(file);
              player.play();
              triggerAchievement('Local Track', 'Audio Maestro: Uploaded local song!');
            }
          };
        }
      }, 50);
    }

    function renderCursorManager(el) {
      el.innerHTML = `
        <h3>Custom Cursor Manager</h3>
        <p style="color:var(--text-muted)">Upload any picture from your photo library to set as cursor.</p>
        <input type="file" id="cursor-file" accept="image/*" />
        <div style="margin-top:12px;">
          <button class="btn" id="reset-cursor">Reset Default Cursor</button>
        </div>
      `;
      setTimeout(() => {
        const fileInp = document.getElementById('cursor-file');
        const resetBtn = document.getElementById('reset-cursor');
        if (fileInp) {
          fileInp.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (evt) => {
                document.body.style.cursor = `url(${evt.target.result}), auto`;
                triggerAchievement('Custom Photo Cursor', 'Designer: Changed photo cursor!');
              };
              reader.readAsDataURL(file);
            }
          };
        }
        if (resetBtn) {
          resetBtn.onclick = () => {
            document.body.style.cursor = 'default';
          };
        }
      }, 50);
    }

    function renderSettings(el) {
      el.innerHTML = `
        <h3>System Settings</h3>
        <p style="color:var(--text-muted)">Configure background wallpaper and OS performance.</p>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
          <button class="btn" onclick="document.getElementById('desktop').style.background='#030712'">Dark Theme</button>
          <button class="btn" style="background:#065f46; color:#fff" onclick="document.getElementById('desktop').style.background='radial-gradient(circle at center, #065f46 0%, #022c22 45%, #030712 100%)'">Emerald Gradient</button>
        </div>
      `;
    }

    function renderAchievements(el) {
      el.innerHTML = `
        <h3>Achievements Tracker</h3>
        <p style="color:var(--text-muted)">Unlocked system milestones:</p>
        <ul id="achievements-list" style="margin-left:20px; margin-top:10px; display:flex; flex-direction:column; gap:6px;"></ul>
      `;
      setTimeout(() => {
        const list = document.getElementById('achievements-list');
        if (!list) return;
        if (state.achievements.size === 0) {
          list.innerHTML = '<li style="color:var(--text-muted)">No achievements unlocked yet. Explore Emerald OS!</li>';
        } else {
          list.innerHTML = '';
          state.achievements.forEach(ach => {
            const li = document.createElement('li');
            li.innerText = '🏆 ' + ach;
            list.appendChild(li);
          });
        }
      }, 50);
    }

    function triggerAchievement(id, title) {
      if (!state.achievements.has(title)) {
        state.achievements.add(title);
        const toast = document.getElementById('achievement-toast');
        toast.innerText = `🏆 ${title}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      }
    }

    // --- 3D Grid Canvas Background ---
    function init3DWorld() {
      const canvas = document.getElementById('world3d');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      let offset = 0;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        offset += 1.2;
        for (let i = 0; i < 35; i++) {
          let z = (i * 30 - (offset % 30));
          if (z <= 0) continue;
          let k = 200 / z;
          let r = 500 * k;

          ctx.strokeStyle = `rgba(16, 185, 129, ${Math.max(0, 0.35 - z / 800)})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        }

        requestAnimationFrame(render);
      }
      render();
    }

    // --- System Time Clock ---
    function updateTime() {
      const now = new Date();
      const el = document.getElementById('system-time');
      if (el) {
        el.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }
    }

    // --- OS Startup ---
    window.addEventListener('DOMContentLoaded', () => {
      renderDesktopIcons();
      renderStartMenu();
      init3DWorld();
      updateTime();
      setInterval(updateTime, 1000);

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
          closeStartMenu();
        }
      });
    });
  </script>
</body>
</html>
