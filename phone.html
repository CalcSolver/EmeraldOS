<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FaceTime for Switch</title>
    <!-- PeerJS CDN for WebRTC calling -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* --- STAGE / VIDEO CONTAINERS --- */
        #call-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Remote Video (Main Screen) */
        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #1c1c1e;
        }

        /* Local PIP Tile */
        #local-video-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 130px;
            height: 190px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
            background: #2c2c2e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #local-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Switch Fallback Avatar when camera is blocked */
        #switch-avatar {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 0.8rem;
            text-align: center;
            padding: 10px;
        }

        .avatar-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #fff;
            font-weight: bold;
        }

        /* --- LOBBY / CONNECTION OVERLAY --- */
        #lobby-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .facetime-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 18px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
        }

        .id-display {
            font-size: 1.3rem;
            font-weight: 600;
            color: #34c759;
            letter-spacing: 1px;
            word-break: break-all;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 1rem;
            outline: none;
            margin-bottom: 12px;
            text-align: center;
        }

        .btn-call {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #34c759;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* --- FACETIME BOTTOM CONTROL BAR --- */
        #controls-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 44, 46, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 35px;
            padding: 10px 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 15;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .control-btn.end-call {
            background: #ff3b30;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="call-stage">
        <!-- Main Incoming Video -->
        <video id="remote-video" autoplay playsinline></video>

        <!-- PIP Corner Container -->
        <div id="local-video-container">
            <video id="local-video" autoplay playsinline muted class="hidden"></video>
            <div id="switch-avatar">
                <div class="avatar-icon">🎮</div>
                <span>Nintendo Switch</span>
            </div>
        </div>

        <!-- FaceTime Control Bar -->
        <div id="controls-bar" class="hidden">
            <button id="btn-end-call" class="control-btn end-call" title="End Call">📞</button>
        </div>

        <!-- FaceTime Lobby Overlay -->
        <div id="lobby-overlay">
            <div class="facetime-title">FaceTime</div>

            <!-- Your ID -->
            <div class="card">
                <p>YOUR FACETIME ID</p>
                <div id="my-peer-id" class="id-display">Connecting...</div>
            </div>

            <!-- Join Call -->
            <div class="card">
                <p>CALL A FRIEND (PHONE / PC)</p>
                <input type="text" id="target-peer-id" placeholder="Enter Friend's ID">
                <button id="btn-start-call" class="btn-call">FaceTime Video</button>
            </div>
        </div>
    </div>

    <script>
        let localStream = null;
        let peer = null;
        let currentCall = null;

        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const switchAvatar = document.getElementById('switch-avatar');
        const myPeerIdEl = document.getElementById('my-peer-id');
        const targetPeerIdInput = document.getElementById('target-peer-id');
        const lobbyOverlay = document.getElementById('lobby-overlay');
        const controlsBar = document.getElementById('controls-bar');

        const btnStartCall = document.getElementById('btn-start-call');
        const btnEndCall = document.getElementById('btn-end-call');

        async function init() {
            // Attempt camera access (works on phone/PC, falls back gracefully on Switch)
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                localVideo.classList.remove('hidden');
                switchAvatar.classList.add('hidden');
            } catch (err) {
                console.log("Running in Switch mode (Camera/Mic disabled by OS hardware restrictions).");
            }

            // Create PeerJS Connection
            peer = new Peer();

            peer.on('open', (id) => {
                myPeerIdEl.innerText = id;
            });

            // Handle Incoming Calls (Receiving video on Switch)
            peer.on('call', (call) => {
                currentCall = call;
                call.answer(localStream || undefined);
                
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    showInCallUI();
                });

                call.on('close', endCallUI);
            });
        }

        // Call Friend
        btnStartCall.addEventListener('click', () => {
            const targetId = targetPeerIdInput.value.trim();
            if (!targetId) {
                alert("Please enter a valid FaceTime ID!");
                return;
            }

            currentCall = peer.call(targetId, localStream || undefined);

            currentCall.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                showInCallUI();
            });

            currentCall.on('close', endCallUI);
        });

        // End Call
        btnEndCall.addEventListener('click', () => {
            if (currentCall) currentCall.close();
            endCallUI();
        });

        function showInCallUI() {
            lobbyOverlay.classList.add('hidden');
            controlsBar.classList.remove('hidden');
        }

        function endCallUI() {
            remoteVideo.srcObject = null;
            controlsBar.classList.add('hidden');
            lobbyOverlay.classList.remove('hidden');
        }

        init();
    </script>
</body>
</html>
